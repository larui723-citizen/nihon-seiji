<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本政治シミュレーション 完全版</title>
<style>
:root{
--ink:#18212f;
--muted:#64748b;
--line:#d9e1ea;
--card:rgba(255,255,255,.94);
--dark:#111827;
--accent:#2563eb;
--accent2:#0f766e;
--danger:#dc2626;
--gold:#b7791f;
--shadow:0 10px 28px rgba(15,23,42,.10);
}

*{box-sizing:border-box}

body{
margin:0;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
"Noto Sans JP",
"Hiragino Kaku Gothic ProN",
"Yu Gothic",
sans-serif;
color:var(--ink);
background:#eef2f7;
}

button,
input,
select,
textarea{
font:inherit;
}

button{
cursor:pointer;
}

button:active{
transform:translateY(2px);
box-shadow:0 2px 5px rgba(0,0,0,.12);
}

.app{
min-height:100vh;
}

.topbar{
position:sticky;
top:0;
z-index:50;
background:rgba(17,24,39,.97);
color:white;
box-shadow:0 4px 20px rgba(0,0,0,.18);
}

.topbar-inner{
max-width:1500px;
margin:auto;
padding:12px 18px;
display:flex;
justify-content:space-between;
align-items:center;
gap:16px;
}

.logo{
font-size:20px;
font-weight:800;
letter-spacing:.02em;
}

.datebox{
display:flex;
gap:8px;
align-items:center;
flex-wrap:wrap;
justify-content:flex-end;
}

.badge{
display:inline-flex;
align-items:center;
gap:5px;
padding:4px 9px;
border-radius:999px;
background:#e2e8f0;
color:#334155;
font-size:12px;
font-weight:700;
}

.badge.dark{
background:#334155;
color:white;
}

.badge.green{
background:#dcfce7;
color:#166534;
}

.badge.red{
background:#fee2e2;
color:#991b1b;
}

.badge.gold{
background:#fef3c7;
color:#92400e;
}

.layout{
max-width:1500px;
margin:auto;
display:grid;
grid-template-columns:220px 1fr;
min-height:calc(100vh - 64px);
}

.sidebar{
background:#f8fafc;
border-right:1px solid var(--line);
padding:14px 10px;
position:sticky;
top:64px;
height:calc(100vh - 64px);
overflow:auto;
}

.nav-title{
color:#94a3b8;
font-size:11px;
font-weight:800;
padding:10px 10px 6px;
letter-spacing:.08em;
}

.nav-btn{
width:100%;
border:0;
background:transparent;
color:#334155;
text-align:left;
padding:11px 12px;
border-radius:10px;
margin:2px 0;
font-weight:700;
transition:.15s;
}

.nav-btn:hover{
background:#e8eef6;
}

.nav-btn.active{
background:#dbeafe;
color:#1d4ed8;
}

.main{
padding:18px;
min-width:0;
}

.home-bg{
border-radius:18px;
padding:20px;
min-height:250px;
background:
linear-gradient(
105deg,
rgba(30,70,190,.28),
rgba(255,255,255,.88) 48%,
rgba(210,40,40,.28)
);
box-shadow:var(--shadow);
transition:background .5s;
}

.home-head{
display:flex;
justify-content:space-between;
gap:18px;
flex-wrap:wrap;
}

h1,h2,h3{
margin-top:0;
}

h1{
font-size:30px;
margin-bottom:6px;
}

h2{
font-size:21px;
margin-bottom:12px;
}

h3{
font-size:16px;
margin-bottom:8px;
}

.subtitle{
color:#475569;
}

.grid{
display:grid;
gap:14px;
}

.grid-2{
grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
grid-template-columns:repeat(4,minmax(0,1fr));
}

.card{
background:var(--card);
border:1px solid rgba(203,213,225,.85);
border-radius:16px;
padding:16px;
box-shadow:var(--shadow);
}

.card.soft{
background:rgba(248,250,252,.92);
}

.metric{
font-size:26px;
font-weight:850;
line-height:1;
margin:5px 0;
}

.metric-small{
font-size:18px;
font-weight:800;
}

.muted{
color:var(--muted);
font-size:13px;
}

.small{
font-size:12px;
}

.big-number{
font-size:34px;
font-weight:900;
}

.progress{
height:9px;
background:#e5e7eb;
border-radius:999px;
overflow:hidden;
margin-top:7px;
}

.progress > div{
height:100%;
background:var(--accent);
border-radius:999px;
transition:width .3s;
}

.progress.green > div{
background:#059669;
}

.progress.red > div{
background:#dc2626;
}

.progress.gold > div{
background:#d97706;
}

.row{
display:flex;
gap:8px;
align-items:center;
flex-wrap:wrap;
}

.between{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
}

.btn{
border:1px solid #cbd5e1;
background:white;
color:#1e293b;
padding:9px 13px;
border-radius:9px;
font-weight:750;
transition:.12s;
box-shadow:0 2px 5px rgba(15,23,42,.06);
}

.btn:hover{
background:#f8fafc;
border-color:#94a3b8;
}

.btn.primary{
background:#2563eb;
color:white;
border-color:#2563eb;
}

.btn.primary:hover{
background:#1d4ed8;
}

.btn.success{
background:#059669;
color:white;
border-color:#059669;
}

.btn.danger{
background:#dc2626;
color:white;
border-color:#dc2626;
}

.btn.gold{
background:#d97706;
color:white;
border-color:#d97706;
}

.btn.dark{
background:#1f2937;
color:white;
border-color:#1f2937;
}

.btn:disabled{
opacity:.45;
cursor:not-allowed;
transform:none;
}

.input,
.select,
.textarea{
width:100%;
border:1px solid #cbd5e1;
border-radius:9px;
padding:10px 11px;
background:white;
outline:none;
}

.input:focus,
.select:focus,
.textarea:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.textarea{
min-height:90px;
resize:vertical;
}

.label{
display:block;
font-size:12px;
color:#475569;
font-weight:800;
margin:10px 0 5px;
}

.table-wrap{
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:600px;
}

th,td{
border-bottom:1px solid #e2e8f0;
padding:9px 8px;
text-align:left;
font-size:13px;
}

th{
color:#475569;
background:#f8fafc;
}

.notice{
border-left:4px solid #2563eb;
padding:10px 12px;
background:#eff6ff;
border-radius:8px;
margin:10px 0;
}

.warning{
border-left-color:#d97706;
background:#fffbeb;
}

.danger-box{
border-left:4px solid #dc2626;
padding:10px 12px;
background:#fef2f2;
border-radius:8px;
}

.news-item{
border:1px solid #e2e8f0;
border-radius:11px;
padding:12px;
margin-bottom:9px;
background:white;
cursor:pointer;
transition:.12s;
}

.news-item:hover{
border-color:#93c5fd;
transform:translateY(-1px);
}

.news-type{
font-size:11px;
font-weight:850;
color:#2563eb;
}

.news-title{
font-weight:800;
margin:3px 0;
}

.news-body{
font-size:13px;
color:#475569;
}

.kpi{
display:flex;
justify-content:space-between;
padding:7px 0;
border-bottom:1px dashed #dbe2ea;
}

.kpi:last-child{
border-bottom:0;
}

.tag{
display:inline-block;
padding:3px 7px;
border-radius:5px;
background:#e2e8f0;
color:#334155;
font-size:11px;
font-weight:800;
margin:2px;
}

.tag.blue{
background:#dbeafe;
color:#1d4ed8;
}

.tag.red{
background:#fee2e2;
color:#b91c1c;
}

.tag.green{
background:#dcfce7;
color:#166534;
}

.tag.gold{
background:#fef3c7;
color:#92400e;
}

.person-card{
border:1px solid #dbe2ea;
border-radius:12px;
padding:12px;
background:white;
}

.person-name{
font-weight:850;
}

.person-meta{
font-size:12px;
color:#64748b;
margin:3px 0 7px;
}

.person-stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:5px;
font-size:11px;
}

.person-actions{
margin-top:9px;
display:flex;
gap:6px;
flex-wrap:wrap;
}

.tabs{
display:flex;
gap:5px;
overflow:auto;
margin-bottom:13px;
}

.tab{
border:0;
background:#e2e8f0;
padding:9px 13px;
border-radius:8px;
font-weight:750;
white-space:nowrap;
}

.tab.active{
background:#1e40af;
color:white;
}

.map{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
}

.district{
min-height:105px;
border:1px solid #cbd5e1;
border-radius:10px;
background:white;
padding:9px;
}

.district-name{
font-weight:850;
font-size:13px;
}

.district-small{
color:#64748b;
font-size:11px;
}

.vote{
display:flex;
gap:8px;
margin:8px 0;
}

.vote .btn{
flex:1;
}

.event-modal{
position:fixed;
inset:0;
background:rgba(15,23,42,.58);
z-index:100;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
}

.modal-card{
width:min(850px,100%);
max-height:90vh;
overflow:auto;
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 30px 80px rgba(0,0,0,.3);
}

.modal-card h2{
margin-bottom:5px;
}

.choice-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
margin-top:14px;
}

.choice{
border:1px solid #cbd5e1;
background:#f8fafc;
padding:12px;
border-radius:10px;
text-align:left;
cursor:pointer;
}

.choice:hover{
border-color:#2563eb;
background:#eff6ff;
}

.chart{
height:180px;
display:flex;
align-items:flex-end;
gap:5px;
border-bottom:1px solid #cbd5e1;
border-left:1px solid #cbd5e1;
padding:8px;
}

.bar{
flex:1;
min-width:4px;
background:#3b82f6;
border-radius:4px 4px 0 0;
}

.timeline{
border-left:3px solid #dbeafe;
margin-left:8px;
padding-left:15px;
}

.timeline-item{
position:relative;
padding-bottom:14px;
}

.timeline-item:before{
content:"";
position:absolute;
left:-23px;
top:2px;
width:9px;
height:9px;
border-radius:50%;
background:#2563eb;
}

.hidden{
display:none!important;
}

hr{
border:0;
border-top:1px solid #e2e8f0;
margin:14px 0;
}

.footer-note{
text-align:center;
color:#94a3b8;
font-size:11px;
padding:25px;
}

@media(max-width:1000px){
.layout{
grid-template-columns:1fr;
}
.sidebar{
position:static;
height:auto;
display:flex;
overflow:auto;
gap:5px;
border-right:0;
border-bottom:1px solid var(--line);
}
.nav-title{
display:none;
}
.nav-btn{
min-width:max-content;
}
.grid-4{
grid-template-columns:repeat(2,minmax(0,1fr));
}
}

@media(max-width:700px){
.main{
padding:10px;
}
.grid-2,
.grid-3,
.grid-4{
grid-template-columns:1fr;
}
.map{
grid-template-columns:repeat(2,1fr);
}
.choice-grid{
grid-template-columns:1fr;
}
h1{
font-size:24px;
}
}
</style>
</head>

/* =========================================================
ユーティリティ
========================================================= */

function safe(v){
return String(v ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function clamp(v,min,max){
return Math.max(min,Math.min(max,v));
}

function rand(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}

function pick(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function uid(prefix="id"){
return prefix+"_"+Math.random().toString(36).slice(2,9)+"_"+Date.now().toString(36);
}

function fmtPct(v){
return `${Number(v).toFixed(1)}%`;
}

function currentDate(){
return `${state.year}年${state.month}月`;
}

function monthIndex(year,month){
return year*12+month;
}

function monthsFromNow(year,month){
return monthIndex(year,month)-monthIndex(state.year,state.month);
}

function partyName(id){
return state.parties[id]?.name || PARTY_DEFS[id]?.name || "不明政党";
}

function politicianById(id){
return state.politicians.find(p=>p.id===id);
}

function player(){
return state.player;
}

function isPlayerLeader(){
return state.player.isPartyLeader === true;
}

function isPlayerPM(){
return state.player.isPrimeMinister === true;
}

function playerParty(){
return state.parties[state.player.partyId];
}

function addNews(type,title,body,details=""){
state.news.unshift({
id:uid("news"),
year:state.year,
month:state.month,
type,
title,
body,
details
});
if(state.news.length>100) state.news.length=100;
}

function logEvent(text){
state.history.unshift({
date:currentDate(),
text
});
if(state.history.length>80) state.history.length=80;
}

function randomSupport(){
const out={};
Object.keys(PARTY_DEFS).forEach(id=>{
if(id==="other") return;
out[id]=rand(3,27)+Math.random();
});
const sum=Object.values(out).reduce((a,b)=>a+b,0);
Object.keys(out).forEach(id=>{
out[id]=clamp(out[id]/sum*100,2,40);
});
return out;
}

function deepClone(obj){
return JSON.parse(JSON.stringify(obj));
}

function renderPolicyEvaluation(){
const p=state.player.policy;

const fiscal=
Math.abs(p.economy)+Math.max(0,p.welfare)*.35+Math.max(0,p.defense)*.25;

const feasibility=
100-
Math.abs(p.economy)*.2-
Math.abs(p.welfare)*.15+
state.player.reputation*.15;

const growth=
p.economy*.12+
p.diplomacy*.04+
p.defense*.02;

const inflation=
p.welfare*.06+
p.defense*.04+
p.economy*.02;

const rate=
inflation*.03+
p.defense*.01;

const score=clamp(
50+
state.player.reputation*.15+
state.player.recognition*.05-
Math.abs(p.economy-p.welfare)*.08,
0,100
);

return `
<div class="grid grid-4" style="margin-top:12px">
<div class="card soft">
<div class="muted">財政負担</div>
<div class="metric-small">${fiscal>80?"大":fiscal>45?"中":"小"}</div>
</div>

function generateLeadershipCandidates(){
const party=playerParty();
const own=state.politicians.filter(p=>
p.partyId===state.player.partyId &&
p.status==="active"
);

let candidates=own
.sort((a,b)=>
(b.internalPower+b.reputation+b.achievements)-
(a.internalPower+a.reputation+a.achievements)
)
.slice(0,4);

const result=candidates.map(p=>({
id:p.id,
name:p.name,
group:p.group,
achievement:p.electedTerms*5,
reputation:p.reputation,
policyScore:Math.round(
Object.values(p.policySkills).reduce((a,b)=>a+b,0)/
Object.values(p.policySkills).length
),
network:p.internalPower,
support:clamp(
20+
p.internalPower*.45+
p.reputation*.15+
p.nationalSupport*.15+
rand(-8,8),
5,85
),
platform:autoPlatform(p)
}));

result.push({
id:"player_candidate",
name:state.player.name,
group:"本人",
achievement:state.player.achievements,
reputation:state.player.reputation,
policyScore:Math.round(
Object.values(state.player.policy).reduce((a,b)=>a+b,0)/
Object.values(state.player.policy).length
),
network:state.player.internalSupport,
support:clamp(
state.player.internalSupport*.75+
state.player.reputation*.15+
state.player.achievements*.1,
2,90
),
platform:"本人が掲げる政策を明確にして党内支持を集める必要があります。",
isPlayer:true
});

return result;
}

function autoPlatform(p){
const x=p.policySkills;
const lines=[];

if(x.economy>65)lines.push("成長重視");
else lines.push("財政規律");

if(x.welfare>65)lines.push("社会保障の充実");
else lines.push("制度改革");

if(x.defense>70)lines.push("防衛力強化");
else lines.push("外交・対話");

return lines.join("、")+"を掲げる方針。";
}

/* =========================================================
Actions
========================================================= */

function handleAction(action,el){
const id=el.dataset.id;

switch(action){
case"advance":
advanceMonths(1);
break;

case"advance3":
advanceMonths(3);
break;

case"autoToggle":
state.autoMode=!state.autoMode;
logEvent(`自動行動を${state.autoMode?"ON":"OFF"}にした。`);
saveGame();
render();
break;

case"save":
saveGame();
alert("ゲームを保存しました。");
break;

case"load":
loadGame();
break;

case"reset":
if(confirm("本当に最初からやり直しますか？")){
state=createInitialState();
saveGame();
render();
}
break;

case"speech":
doAction("speech");
break;

case"local":
doAction("local");
break;

case"media":
doAction("media");
break;

case"policyStudy":
doAction("policyStudy");
break;

case"partySpeech":
doPartyAction("speech");
break;

case"partyMeeting":
doPartyAction("meeting");
break;

case"policyNegotiation":
doPartyAction("negotiation");
break;

case"leadership":
openLeadership();
break;

case"leadershipRun":
runLeadership();
break;

case"leadershipVote":
voteLeadership(id);
break;

case"leadershipClose":
closeLeadership();
break;

case"meet":
openMeeting(id,false);
break;

case"dinner":
openMeeting(id,true);
break;

case"relationship":
showRelationship(id);
break;

case"recruitMember":
recruitMember();
break;

case"newParty":
newPartyDialog();
break;

case"newBill":
createBill();
break;

case"voteBill":
voteBill(el.dataset.vote);
break;

case"candidateManager":
openCandidateManager(el.dataset.house);
break;

case"prManager":
openPRManager(el.dataset.house);
break;

case"setDistrict":
openCandidateManager("lower",el.dataset.district);
break;

case"chooseDistrictCandidate":
chooseDistrictCandidate(el.dataset.district,id);
break;

case"addPR":
addPR(el.dataset.house,id);
break;

case"removePR":
removePR(el.dataset.house,id);
break;

case"appoint":
appointMinister(el.dataset.ministry);
break;

case"removeMinister":
removeMinister(el.dataset.ministry);
break;

case"evaluatePolicy":
render();
break;

case"opinionEvent":
openOpinionEvent();
break;

case"opinionChoice":
resolveOpinion(Number(el.dataset.choice));
break;

case"foreignMeeting":
openForeignMeeting(id);
break;

case"foreignChoice":
resolveForeignMeeting(el.dataset.choice);
break;

case"generateEvent":
generateRandomEvent();
break;

case"publishSupport":
publishSupport();
break;

case"closeModal":
state.pendingEvent=null;
render();
break;

case"meetingChoice":
resolveMeeting(el.dataset.choice);
break;

case"savePledge":
savePledge();
break;

default:
break;
}
}

/* =========================================================
Monthly actions
========================================================= */

function doAction(type,quiet=false){
const p=state.player;

if(type==="speech"){
p.recognition+=rand(1,3);
p.personalSupport+=rand(0,1)*.5;
p.politicalCapital-=1;
p.localSupport+=rand(0,2);
p.reputation+=Math.random()>.45?1:0;
logEvent("街頭演説を行い、地元と知名度を伸ばした。");
}

if(type==="local"){
p.localSupport+=rand(1,3);
p.internalSupport+=.2;
p.reputation+=.5;
p.politicalCapital-=.5;
logEvent("地元活動を行った。");
}

if(type==="media"){
p.recognition+=rand(2,5);
p.personalSupport+=rand(0,2)*.5;
p.politicalCapital-=1;
logEvent("メディア出演で知名度を高めた。");

if(state.flags.newParty){
growNewParty();
}
}

if(type==="policyStudy"){
p.reputation+=1;
p.politicalCapital+=1;
p.policyBonus=(p.policyBonus||0)+1;
logEvent("政策研究を行い、実務能力を高めた。");
}

p.recognition=clamp(p.recognition,0,100);
p.personalSupport=clamp(p.personalSupport,0,100);
p.internalSupport=clamp(p.internalSupport,0,100);
p.reputation=clamp(p.reputation,0,100);
p.localSupport=clamp(p.localSupport,0,100);

if(!quiet){
saveGame();
render();
}
}

function doPartyAction(type){
if(!isPartyPoliticsUnlocked()){
alert("まだ党内政治の解禁時期ではありません。");
return;
}

const p=state.player;

if(type==="speech"){
p.internalSupport+=rand(1,3);
p.politicalCapital-=1;
p.reputation+=1;
logEvent("党内演説を行った。");
}

if(type==="meeting"){
p.internalSupport+=rand(0,2);
p.politicalCapital-=1;
logEvent("党内会合に参加した。");
}

if(type==="negotiation"){
p.internalSupport+=rand(1,2);
p.politicalCapital-=2;
p.reputation+=1;
logEvent("政策調整を行った。");
}

p.internalSupport=clamp(p.internalSupport,0,100);
saveGame();
render();
}

function isPartyPoliticsUnlocked(){
return monthIndex(state.year,state.month)>=
monthIndex(state.partyPoliticsUnlockYear,state.partyPoliticsUnlockMonth);
}

function growNewParty(){
const party=playerParty();
if(!state.flags.newParty || !party)return;

const growth=rand(0,3);

for(let i=0;i<growth;i++){
const names=[
"高橋健一","森田優子","小川翔","藤井拓也",
"木村真紀","松本大輔","石井美咲","中島亮"
];
state.partyMembers.push(
makePartyMember(
pick(names)+rand(1,99),
party.id,
"党員"
)
);
}

party.members=state.partyMembers.filter(x=>x.partyId===party.id).length;
party.recognition=clamp(
party.recognition+state.player.recognition*.01,
0,100
);

if(party.members>10){
party.support+=.1;
}
}

/* =========================================================
Advance time
========================================================= */

function advanceMonths(n){
if(state.pendingEvent){
alert("先に現在のイベントを処理してください。");
return;
}

for(let i=0;i<n;i++){
advanceOneMonth();

if(state.pendingEvent)break;
}

saveGame();
render();
}

function advanceOneMonth(){
state.month++;
if(state.month>12){
state.month=1;
state.year++;
}

state.turnCount++;

if(state.autoMode){
runAutomaticActions();
}

updateEconomy();
updateSecurity();
updatePartySupport();
growAndRetirePoliticians();
updateRelationships();
checkPartySupportPublication();
checkElectionPledge();
checkElections();
checkLeadershipElection();
generateMonthlyNews();
maybeOpinionEvent();
maybeForeignAutoMeeting();
maybeGenerateNewPolitician();

if(state.flags.newParty){
growNewParty();
}

logEvent(`${currentDate()}になった。`);
}

function runAutomaticActions(){
const actions=["speech","local","media","policyStudy"];

for(let i=0;i<state.autoActions;i++){
const choice=actions[Math.floor(Math.random()*actions.length)];
doAction(choice,true);
}
}

function updateEconomy(){
const p=state.player.policy;

const eventShock=state.economyShock||0;

state.economy.cpi +=
p.welfare*.003+
p.defense*.001+
(Math.random()-.5)*.25+
eventShock*.15;

state.economy.cpi=clamp(state.economy.cpi,0,10);

state.economy.policyRate +=
(state.economy.cpi-2.0)*.025+
(Math.random()-.5)*.04;

state.economy.policyRate=clamp(state.economy.policyRate,-.1,5);

state.economy.gasoline +=
(state.economy.usdJpy-145)*.03+
(Math.random()-.5)*2+
eventShock*3;

state.economy.gasoline=clamp(state.economy.gasoline,120,260);

state.economy.ricePrice+=
(Math.random()-.5)*80+
(state.riceShock||0);

state.economy.ricePrice=clamp(state.economy.ricePrice,2500,8000);

state.economy.seafoodPrice+=
(Math.random()-.5)*2+
(state.seafoodShock||0);

state.economy.seafoodPrice=clamp(state.economy.seafoodPrice,70,160);

state.economy.unemployment+=
-(state.economy.gdpGrowth*.02)+
(Math.random()-.5)*.08;

state.economy.unemployment=clamp(state.economy.unemployment,1.5,6);

state.economy.wageGrowth+=
(state.economy.cpi-2)*.05+
(Math.random()-.5)*.08;

state.economy.wageGrowth=clamp(state.economy.wageGrowth,0,6);

state.economy.gdpGrowth=
1+
p.economy*.015+
p.diplomacy*.005-
p.defense*.002+
(Math.random()-.5)*.7;

state.economy.gdpGrowth=clamp(state.economy.gdpGrowth,-4,6);

state.economy.usdJpy+=
(state.economy.policyRate-.75)*.8+
(Math.random()-.5)*2;

state.economy.usdJpy=clamp(state.economy.usdJpy,100,190);

const stockChange=
state.economy.gdpGrowth*.006-
(state.economy.policyRate-.75)*.012+
(state.nationalIdeology*.0003)+
(Math.random()-.5)*.025;

state.economy.nikkei*=(1+stockChange);
state.economy.nikkei=clamp(state.economy.nikkei,18000,65000);

state.economyShock*=.75;
state.riceShock*=.85;
state.seafoodShock*=.85;
}

function updateSecurity(){
state.security.crimeIndex+=
(Math.random()-.5)*2+
state.economy.unemployment*.04;

state.security.crimeIndex=clamp(state.security.crimeIndex,70,140);

state.security.violentCrime+=
(Math.random()-.5)*20+
(state.security.crimeIndex-100)*.12;

state.security.violentCrime=clamp(state.security.violentCrime,700,1800);

state.security.theftCases+=
(state.security.crimeIndex-100)*8+
(Math.random()-.5)*180;

state.security.theftCases=clamp(state.security.theftCases,8000,35000);

state.security.foreignInvolvedCases+=
(Math.random()-.5)*25;

state.security.foreignInvolvedCases=clamp(
state.security.foreignInvolvedCases,
400,1600
);

state.security.cyberIncidents+=
rand(-20,35);

state.security.cyberIncidents=clamp(
state.security.cyberIncidents,
100,1500
);

state.security.publicSafety=
clamp(
100-
(state.security.crimeIndex-70)*.35-
state.economy.unemployment*2+
(Math.random()-.5)*2,
40,95
);
}

function updatePartySupport(){
const ids=Object.keys(state.parties);

ids.forEach(id=>{
const party=state.parties[id];

let change=(Math.random()-.5)*1.1;

if(id===state.governmentPartyId){
change+=
state.economy.gdpGrowth*.08-
Math.max(0,state.economy.cpi-3)*.1;
}

if(id===state.player.partyId){
change+=
state.player.personalSupport*.008+
state.player.reputation*.004;
}

party.support=clamp(party.support+change,.5,45);

state.partySupport[id]=party.support;
});

const total=Object.values(state.partySupport).reduce((a,b)=>a+b,0);

if(total>100){
Object.keys(state.partySupport).forEach(id=>{
state.partySupport[id]=state.partySupport[id]/total*100;
state.parties[id].support=state.partySupport[id];
});
}

state.nationalIdeology=
clamp(
Object.entries(state.partySupport).reduce((sum,[id,s])=>
sum+(state.parties[id]?.ideology||0)*s
,0)/100,
-100,100
);
}

/* =========================================================
Elections
========================================================= */

function checkElections(){
if(
state.year===state.elections.lower.nextYear &&
state.month===state.elections.lower.nextMonth
){
runLowerElection();
}

if(
state.year===state.elections.upper.nextYear &&
state.month===state.elections.upper.nextMonth
){
runUpperElection();
}
}

function runLowerElection(){
Object.values(state.parties).forEach(p=>{
const old=p.seatsLower;

const strength=
p.support+
(p.pledge?2:0)+
(p.recognition-50)*.05+
rand(-5,5);

p.seatsLower=0;

p._electionStrength=Math.max(.5,strength);

if(old>0){
p._electionStrength+=old*.025;
}
});

allocateSeats("lower");

addNews(
"選挙",
"衆議院総選挙",
"ゲーム内総選挙が行われ、各党の議席が更新された。",
Object.values(state.parties)
.sort((a,b)=>b.seatsLower-a.seatsLower)
.map(p=>`${p.name} ${p.seatsLower}議席`)
.join("、")
);

handlePlayerElectionResult("lower");

state.elections.lower.nextYear+=4;
state.elections.lower.nextMonth=10;

updateGovernmentAfterElection();
}

function runUpperElection(){
Object.values(state.parties).forEach(p=>{
const old=p.seatsUpper;
const strength=
p.support+
(p.pledge?1.5:0)+
rand(-4,4);

p._electionStrength=Math.max(.5,strength);
p._oldUpper=old;
});

allocateUpperSeats();

addNews(
"選挙",
"参議院選挙",
"ゲーム内参院選が行われ、議席構成が変化した。",
Object.values(state.parties)
.sort((a,b)=>b.seatsUpper-a.seatsUpper)
.map(p=>`${p.name} ${p.seatsUpper}議席`)
.join("、")
);

state.elections.upper.nextYear+=3;
state.elections.upper.nextMonth=7;
}

function allocateSeats(house){
const total=house==="lower"?HOUSE_TOTAL.lower:HOUSE_TOTAL.upper;
let remaining=total;

const arr=Object.values(state.parties);

for(let i=0;i<total;i++){
const eligible=arr.filter(p=>remaining>0);
const weights=eligible.map(p=>Math.max(.1,p._electionStrength));
const sum=weights.reduce((a,b)=>a+b,0);

let r=Math.random()*sum;

for(let j=0;j<eligible.length;j++){
r-=weights[j];

if(r<=0){
eligible[j].seatsLower++;
remaining--;
break;
}
}
}
}

function allocateUpperSeats(){
const total=HOUSE_TOTAL.upper;
let remaining=total;

Object.values(state.parties).forEach(p=>{
p.seatsUpper=0;
});

const arr=Object.values(state.parties);

for(let i=0;i<total;i++){
const weights=arr.map(p=>Math.max(.1,p._electionStrength));
const sum=weights.reduce((a,b)=>a+b,0);

let r=Math.random()*sum;

for(let j=0;j<arr.length;j++){
r-=weights[j];

if(r<=0){
arr[j].seatsUpper++;
remaining--;
break;
}
}
}
}

function handlePlayerElectionResult(house){
const p=state.player;

if(p.house!=="none"){
return;
}

const party=playerParty();

if(party.seatsLower>0 && Math.random()<clamp(

p.personalSupport*.003+

p.district=DISTRICTS[Math.floor(Math.random()*DISTRICTS.length)];
p.electionExperience++;
p.achievements+=8;
p.internalSupport+=5;
p.personalSupport+=2;

state.politicians.push({
id:p.id,
name:p.name,
partyId:p.partyId,
house:"衆院",
district:p.district,
age:p.age,
reputation:p.reputation,
competence:55,
trustworthiness:65,
group:"新人",
status:"active",
electedTerms:1,
localSupport:p.localSupport,
nationalSupport:p.personalSupport,
internalPower:p.internalSupport,
policySkills:{
economy:55,
diplomacy:55,
defense:50,
welfare:55,
agriculture:45,
transport:45,
education:50
},
lastMeeting:-99
});

addNews(
"個人",
`${p.name}が初当選`,
`${p.name}が衆議院議員に初当選した。`,
"ゲーム内選挙の結果です。"
);

}

function updateGovernmentAfterElection(){
const parties=Object.values(state.parties)
.sort((a,b)=>b.seatsLower-a.seatsLower);

const top=parties[0];

state.governmentPartyId=top.id;

const coalition=[top.id];

let seats=top.seatsLower;

for(const p of parties.slice(1)){
if(seats>=233)break;
if(p.seatsLower>10){
coalition.push(p.id);
seats+=p.seatsLower;
}
}

state.coalition=coalition;

Object.values(state.parties).forEach(p=>{
p.leader=p.leader||"党首未定";
});

if(state.player.partyId===state.governmentPartyId){
state.player.isPrimeMinister=state.player.isPartyLeader;
}else{
state.player.isPrimeMinister=false;
}

addNews(
"政局",
"選挙後の政権構成が決定",
`${top.name}を中心とする政権が発足した。`,
`連立：${coalition.map(id=>state.parties[id].name).join("、")}`
);
}

function checkElectionPledge(){
const monthsLower=monthsFromNow(
state.elections.lower.nextYear,
state.elections.lower.nextMonth
);

const monthsUpper=monthsFromNow(
state.elections.upper.nextYear,
state.elections.upper.nextMonth
);

if(
(monthsLower<=4 && monthsLower>0) ||
(monthsUpper<=4 && monthsUpper>0)
){
if(!playerParty().pledge){
playerParty().support=clamp(
playerParty().support-.35,
.5,45
);
}
}
}

/* =========================================================
Leadership
========================================================= */

function checkLeadershipElection(){
const l=state.leadership;

if(
!l.active &&
state.year===l.nextElectionYear &&
state.month===l.nextElectionMonth
){

}

function openLeadership(){
if(!isPartyPoliticsUnlocked()){
alert(
`党内政治は${state.partyPoliticsUnlockYear}年${state.partyPoliticsUnlockMonth}月から本格解禁です。`
);
return;
}

if(!state.leadership.active){
state.leadership.active=true;
state.leadership.candidates=generateLeadershipCandidates();
}

state.pendingEvent={
type:"leadership",
candidates:state.leadership.candidates
};

render();
}

function runLeadership(){
if(state.player.internalSupport<25){
alert("党内支持が低すぎます。まず党内で実績を作りましょう。");
return;
}

const p=state.player;

const platform=`
経済 ${p.policy.economy>0?"積極":"慎重"}、
社会保障 ${p.policy.welfare>0?"充実":"改革"}、
防衛 ${p.policy.defense>0?"強化":"抑制"}、
外交 ${p.policy.diplomacy>0?"積極":"対話重視"}
`;

const candidate=state.leadership.candidates.find(c=>c.isPlayer);

if(candidate){
candidate.platform=platform;
candidate.support=
clamp(
p.internalSupport*.7+
p.reputation*.2+
p.achievements*.1,
1,90
);
}

state.leadership.platformSubmitted=true;

addNews(
"政局",
`${p.name}が党首選に立候補`,
`${p.name}が党首選への立候補を表明し、政策方針を示した。`,
platform
);

resolveLeadershipElection();
}

function voteLeadership(id){
const candidates=state.leadership.candidates;
const c=candidates.find(x=>x.id===id);

if(!c)return;

resolveLeadershipElection(c.id);
}

function resolveLeadershipElection(votedId=null){
const candidates=state.leadership.candidates;

if(!candidates.length)return;

const weighted=candidates.map(c=>{
let score=c.support;

if(c.isPlayer && state.leadership.platformSubmitted){
score+=state.player.internalSupport*.2;
}

score+=rand(-7,7);

return {
...c,
result:Math.max(1,score)
};
});

if(votedId){
const chosen=weighted.find(x=>x.id===votedId);
if(chosen)chosen.result+=12;
}

weighted.sort((a,b)=>b.result-a.result);

const winner=weighted[0];

if(winner.isPlayer){
state.player.isPartyLeader=true;
playerParty().leader=state.player.name;

if(state.governmentPartyId===state.player.partyId){
state.player.isPrimeMinister=true;
}

addNews(
"個人",
`${state.player.name}が党首に選出`,
`${state.player.name}が党首選を制した。`,
"党首として、党首会談・外交トップ会談・党内政策決定などが解禁されます。"
);

logEvent(`${state.player.name}が党首になった。`);
}else{
state.player.isPartyLeader=false;
state.player.isPrimeMinister=false;

playerParty().leader=winner.name;

addNews(
"政局",
`${winner.name}が党首に選出`,
`${winner.name}が党首に選出された。`,
winner.platform
);

logEvent(`${winner.name}が党首になった。`);
}

state.leadership.active=false;
state.leadership.resolved=true;
state.leadership.nextElectionYear+=2;
state.leadership.nextElectionMonth=9;
state.leadership.platformSubmitted=false;
state.pendingEvent=null;

saveGame();
render();
}

function closeLeadership(){
state.leadership.active=false;
state.pendingEvent=null;
render();
}

function openMeeting(id,isDinner){
const p=politicianById(id);

if(!p)return;

const r=state.relations[id];

const senior=p.internalPower>=70 || p.reputation>=80;

const familiarityReq=senior?(isDinner?75:55):(isDinner?40:15);
const trustReq=senior?(isDinner?45:25):(isDinner?20:8);
const reputationReq=senior?(isDinner?60:45):(isDinner?15:10);

if(
r.familiarity<familiarityReq ||
r.trust<trustReq ||
state.player.reputation<reputationReq
){
alert(
`${p.name}との${isDinner?"会食":"面会"}にはまだ条件が足りません。\n`+
`必要親密度：${familiarityReq}\n`+
`必要信頼：${trustReq}\n`+
`必要評判：${reputationReq}`
);
return;
}

const cooldown=isDinner?9:3;

if(
state.turnCount-r.lastContact<cooldown
){
alert("前回の接触からまだ期間が空いていません。");
return;
}

const chance=
senior?
(isDinner?.42:.62):
(isDinner?.72:.9);

if(Math.random()>chance){
alert(`${p.name}側の都合が合わず、今回は面会できませんでした。`);
r.lastContact=state.turnCount;
return;
}

r.lastContact=state.turnCount;

state.pendingEvent={
type:"meeting",
id,
dinner:isDinner
};

render();
}

function resolveMeeting(choice){
const e=state.pendingEvent;
const p=politicianById(e.id);

if(!p)return;

const r=state.relations[p.id];

if(choice==="policy"){
r.familiarity+=4;
r.trust+=3;
r.respect+=2;
state.player.reputation+=1;
}

if(choice==="respect"){
r.familiarity+=3;
r.trust+=5;
r.respect+=4;
r.favor+=2;
}

if(choice==="future"){
if(state.player.politicalCapital<3){
alert("政治資本が足りません。");
return;
}

state.player.politicalCapital-=3;
r.familiarity+=5;
r.trust+=2;
r.favor+=5;
}

if(choice==="local"){
r.familiarity+=5;
r.trust+=2;
state.player.localSupport+=1;
}

r.familiarity=clamp(r.familiarity,0,100);
r.trust=clamp(r.trust,0,100);
r.respect=clamp(r.respect,0,100);
r.favor=clamp(r.favor,0,100);

addNews(
"個人",
`${p.name}と会談`,
`${state.player.name}が${p.name}と政治的な意見交換を行った。`,
`関係変化：親密度 ${Math.round(r.familiarity)}、信頼 ${Math.round(r.trust)}、尊敬 ${Math.round(r.respect)}`

details:"地方公共交通の維持を支援するゲーム内法案。",

},
{

topic:"農林水産",
sponsor:"政府提出",
details:"農業・漁業の生産基盤を支援するゲーム内法案。",
effect:"食料安全保障にはプラス、財政負担は中程度。"
},
{
title:"防衛基盤整備法案",
topic:"防衛",
sponsor:"政府提出",
details:"防衛装備・人員・基地などの整備を進めるゲーム内法案。",
effect:"安全保障にはプラス、財政負担は大きい。"
}
];

const t=pick(templates);

Object.values(state.parties).forEach(p=>{
let pos="中立";

if(t.topic==="防衛"){
pos=p.ideology>20?"賛成":p.ideology<-30?"反対":"条件付き賛成";
}

if(t.topic.includes("医療")){

positions[p.id]=pos;
});

};

t.details
);

}

/* =========================================================
Bill vote
========================================================= */

function voteBill(vote){
const b=state.currentBill;

if(!b)return;

let yesLower=0;
let noLower=0;
let yesUpper=0;
let noUpper=0;

Object.values(state.parties).forEach(p=>{
let position=b.partyPositions[p.id]||"中立";

let yes=position==="賛成";

if(position==="条件付き賛成"){
yes=Math.random()<.65;
}

if(position==="中立"){
yes=Math.random()<.5;
}

const discipline=.82+Math.random()*.15;

const lower=Math.round(p.seatsLower*discipline);
const upper=Math.round(p.seatsUpper*discipline);

if(yes){
yesLower+=lower;
yesUpper+=upper;
}else{
noLower+=lower;
noUpper+=upper;
}
});

if(vote==="賛成"){
yesLower+=1;
yesUpper+=1;
}else if(vote==="反対"){
noLower+=1;
noUpper+=1;
}

const lowerPassed=yesLower>noLower;
const upperPassed=yesUpper>noUpper;

if(lowerPassed && upperPassed){
addNews(
"政局",
`${b.title}が成立`,
`${b.title}は衆参両院で可決された。`,
`衆院：賛成${yesLower}・反対${noLower}／参院：賛成${yesUpper}・反対${noUpper}`
);

applyBillEffect(b,true);
}else{
addNews(
"政局",
`${b.title}が否決・継続審議`,
`${b.title}は両院を通過できなかった。`,
`衆院：賛成${yesLower}・反対${noLower}／参院：賛成${yesUpper}・反対${noUpper}`
);

applyBillEffect(b,false);
}

state.currentBill=null;
render();
}

function applyBillEffect(b,passed){
if(!passed){
state.player.reputation-=.5;
return;
}

if(b.topic==="交通・地方政策"){
state.economy.gdpGrowth+=.1;
state.player.reputation+=1;
}

if(b.topic==="医療・社会保障"){
state.economy.publicDebt+=.2;
state.player.reputation+=1;
}

if(b.topic==="経済安全保障"){
state.economy.gdpGrowth+=.05;
state.player.reputation+=1;
}

if(b.topic==="農林水産"){
state.economy.ricePrice-=50;
state.player.reputation+=1;
}

if(b.topic==="防衛"){
state.economy.publicDebt+=.5;
state.player.policy.defense+=1;
}
}

);

if(type==="cyber"){

addNews(

);

if(type==="oil"){

if(type==="scandal"){

addNews(
"個人",
"政治資金をめぐる疑惑報道",

);
}

saveGame();
render();
}

/* =========================================================
Monthly news
========================================================= */

function generateMonthlyNews(){
if(Math.random()>.35)return;

const types=[
{
type:"経済",
title:"賃金動向に変化",
body:`平均賃金の伸び率が${state.economy.wageGrowth.toFixed(1)}%となった。`,
details:"景気・物価・人手不足など複数の要因を反映したゲーム内指標です。"
},
{
type:"政局",
title:"各党の政策論争が激化",
body:"国会で経済政策と社会保障をめぐる議論が続いている。",
details:"各党の支持率や議席数によって政局の展開が変わります。"
},
{
type:"経済",
title:"株式市場が変動",
body:`日経平均は${Math.round(state.economy.nikkei).toLocaleString()}円前後で推移した。`,
details:"企業業績、金利、為替、政治情勢などをゲーム内計算で反映しています。"
},
{
type:"事件",
title:"治安統計を更新",
body:`総合治安指数は${state.security.crimeIndex.toFixed(0)}となった。`,
details:`外国籍者が関与した事件数は${Math.round(state.security.foreignInvolvedCases).toLocaleString()}件。これは国籍と犯罪の因果関係を示す指標ではありません。`
}
];

const n=pick(types);

addNews(n.type,n.title,n.body,n.details);
}

/* =========================================================
Save / Load
========================================================= */

function saveGame(){
try{
localStorage.setItem(SAVE_KEY,JSON.stringify(state));
}catch(e){
console.error(e);
}
}

function loadGame(){
try{
const raw=localStorage.getItem(SAVE_KEY);

if(!raw){
alert("保存データがありません。");
return;
}

state=JSON.parse(raw);

/* 古いデータに不足項目があっても壊れにくくする */
state.relations=state.relations||{};
state.news=state.news||[];
state.history=state.history||[];
state.partyMembers=state.partyMembers||[];
state.cabinet=state.cabinet||{};
state.foreignLeaders=state.foreignLeaders||deepClone(FOREIGN_LEADERS);
state.currentBill=state.currentBill||null;
state.pendingEvent=null;

alert("保存データを読み込みました。");
render();
}catch(e){
alert("保存データを読み込めませんでした。");
console.error(e);
}
}

/* =========================================================
New party dialog
========================================================= */

function newPartyDialog(){
const name=prompt("新しい政党名を入力してください。","未来日本党");

if(!name)return;

const playerName=prompt("あなたの政治家名を入力してください。","山田太郎");

if(!playerName)return;

const ideology=prompt(
"党の理念を入力してください。",
"経済成長と社会保障を両立する中道改革"
);

createNewParty(name,playerName,ideology);
}

/* =========================================================
Event handlers
========================================================= */

document.addEventListener("click",e=>{
const nav=e.target.closest("[data-page]");

if(nav){
state.page=nav.dataset.page;
render();
return;
}

const actionEl=e.target.closest("[data-action]");

if(actionEl){
handleAction(actionEl.dataset.action,actionEl);
return;
}

const news=e.target.closest("[data-news-id]");

if(news){
state.pendingEvent={
type:"news",
newsId:news.dataset.newsId
};
render();
}
});

document.addEventListener("input",e=>{
const key=e.target.dataset.policy;

if(key){
state.player.policy[key]=Number(e.target.value);
render();
}
});

/* =========================================================
Keyboard shortcut
========================================================= */

document.addEventListener("keydown",e=>{
if(e.key==="Enter" && e.ctrlKey){
advanceMonths(1);
}
});

/* =========================================================
Startup
========================================================= */

render();

</script>

</html>
