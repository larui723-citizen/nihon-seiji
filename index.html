<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本政治シミュレーター 完全版</title>

<style>
:root{
--bg:#07111f;
--panel:#101d31;
--panel2:#14253d;
--panel3:#1a3150;
--text:#edf5ff;
--muted:#91a7c1;
--cyan:#20d9ff;
--blue:#4f8cff;
--purple:#9b6cff;
--pink:#f15bb5;
--red:#ff5d6c;
--orange:#ffad42;
--yellow:#ffe36e;
--green:#45df9a;
--shadow:0 12px 35px rgba(0,0,0,.28);
}

*{
box-sizing:border-box;
}

html,body{
margin:0;
min-height:100%;
background:var(--bg);
color:var(--text);
font-family:
-apple-system,BlinkMacSystemFont,
"Segoe UI","Noto Sans JP",
"Hiragino Kaku Gothic ProN",
Meiryo,sans-serif;
}

body{
background:
radial-gradient(circle at 10% 10%,rgba(32,217,255,.08),transparent 28%),
radial-gradient(circle at 90% 10%,rgba(155,108,255,.10),transparent 30%),
linear-gradient(135deg,#07111f,#0b1729 50%,#10142b);
}

button,
select,
input,
textarea{
font:inherit;
}

button{
border:0;
color:#fff;
cursor:pointer;
}

button:active{
transform:translateY(2px) scale(.985);
}

button:disabled{
cursor:not-allowed;
opacity:.38;
filter:grayscale(.7);
}

input,
select,
textarea{
width:100%;
background:#0a1728;
color:#fff;
border:1px solid #2b4668;
border-radius:10px;
padding:11px 12px;
outline:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:var(--cyan);
box-shadow:0 0 0 3px rgba(32,217,255,.10);
}

textarea{
min-height:90px;
resize:vertical;
}

.app{
min-height:100vh;
}

.header{
position:sticky;
top:0;
z-index:50;
background:
linear-gradient(90deg,
rgba(8,19,35,.98),
rgba(17,28,54,.98),
rgba(35,19,52,.98));
border-bottom:1px solid rgba(255,255,255,.08);
box-shadow:0 8px 30px rgba(0,0,0,.3);
backdrop-filter:blur(15px);
}

.header-inner{
max-width:1500px;
margin:auto;
padding:16px 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}

.logo{
font-size:22px;
font-weight:900;
letter-spacing:.04em;
}

.logo span{
color:var(--cyan);
}

.top-info{
display:flex;
gap:8px;
flex-wrap:wrap;
justify-content:flex-end;
}

.badge{
display:inline-flex;
align-items:center;
gap:6px;
padding:6px 10px;
border-radius:999px;
font-size:12px;
font-weight:800;
background:#1a2b45;
border:1px solid #345174;
}

.badge.cyan{background:rgba(32,217,255,.12);color:var(--cyan);border-color:rgba(32,217,255,.3)}
.badge.purple{background:rgba(155,108,255,.13);color:#c7b2ff;border-color:rgba(155,108,255,.3)}
.badge.red{background:rgba(255,93,108,.13);color:#ff9aa5;border-color:rgba(255,93,108,.3)}
.badge.green{background:rgba(69,223,154,.13);color:#76efb6;border-color:rgba(69,223,154,.3)}
.badge.orange{background:rgba(255,173,66,.13);color:#ffc579;border-color:rgba(255,173,66,.3)}

.nav-wrap{
max-width:1500px;
margin:auto;
padding:10px 20px 14px;
overflow-x:auto;
}

.nav{
display:flex;
gap:7px;
min-width:max-content;
}

.nav button{
padding:10px 14px;
border-radius:9px;
background:#13233a;
color:#a9bdd4;
border:1px solid #263e5e;
transition:.15s;
}

.nav button:hover{
background:#1d3554;
color:#fff;
border-color:#3c628f;
}

.nav button.active{
background:linear-gradient(135deg,#167fbd,#734bc5);
color:#fff;
border-color:#55d8ff;
box-shadow:0 0 18px rgba(32,217,255,.15);
}

.main{
max-width:1500px;
margin:auto;
padding:24px 20px 70px;
}

.grid{
display:grid;
gap:16px;
}

.grid-2{
grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
grid-template-columns:repeat(4,minmax(0,1fr));
}

@media(max-width:1000px){
.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:700px){
.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
.header-inner{align-items:flex-start;flex-direction:column}
}

.card{
background:
linear-gradient(145deg,
rgba(22,39,64,.96),
rgba(12,25,44,.96));
border:1px solid rgba(116,159,205,.20);
border-radius:16px;
padding:18px;
box-shadow:var(--shadow);
}

.card.cyan{
border-color:rgba(32,217,255,.35);
box-shadow:0 10px 30px rgba(32,217,255,.07);
}

.card.purple{
border-color:rgba(155,108,255,.35);
}

.card.orange{
border-color:rgba(255,173,66,.35);
}

.card.green{
border-color:rgba(69,223,154,.35);
}

.card.red{
border-color:rgba(255,93,108,.35);
}

.card-title{
font-size:17px;
font-weight:900;
margin-bottom:14px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.card-subtitle{
color:var(--muted);
font-size:12px;
margin-top:-7px;
margin-bottom:14px;
}

.kpi{
position:relative;
overflow:hidden;
min-height:125px;
}

.kpi:after{
content:"";
position:absolute;
width:100px;
height:100px;
right:-35px;
bottom:-45px;
border-radius:50%;
background:rgba(255,255,255,.08);
}

.kpi-label{
color:#9cb3cb;
font-size:12px;
}

.kpi-value{
font-size:29px;
font-weight:950;
margin:8px 0;
}

.kpi-note{
font-size:11px;
color:#829ab5;
}

.progress{
height:8px;
background:#081322;
border-radius:999px;
overflow:hidden;
border:1px solid rgba(255,255,255,.05);
}

.progress span{
display:block;
height:100%;
border-radius:999px;
background:linear-gradient(90deg,var(--cyan),var(--purple));
}

.progress.red span{
background:linear-gradient(90deg,#ff6a72,#ffae55);
}

.progress.green span{
background:linear-gradient(90deg,#35d9a0,#8df36d);
}

.progress.blue span{
background:linear-gradient(90deg,#48a8ff,#4f73ff);
}

.action-row{
display:flex;
flex-wrap:wrap;
gap:9px;
margin-top:12px;
}

.btn{
padding:10px 14px;
border-radius:10px;
background:linear-gradient(135deg,#1a4267,#245d83);
border:1px solid #397ba4;
transition:.12s;
font-weight:800;
box-shadow:0 5px 15px rgba(0,0,0,.18);
}

.btn:hover{
filter:brightness(1.15);
transform:translateY(-1px);
}

.btn.primary{
background:linear-gradient(135deg,#0b9ac2,#6c4bd0);
border-color:#4bdcff;
}

.btn.green{
background:linear-gradient(135deg,#147b64,#239c70);
border-color:#47dca3;
}

.btn.red{
background:linear-gradient(135deg,#96394a,#c85445);
border-color:#ff7b83;
}

.btn.orange{
background:linear-gradient(135deg,#9d5b1e,#bc7828);
border-color:#ffc15f;
}

.btn.purple{
background:linear-gradient(135deg,#5537a0,#8b4cc4);
border-color:#b58aff;
}

.btn.dark{
background:#111d30;
border-color:#2b4565;
}

.section-title{
font-size:28px;
font-weight:950;
margin:0 0 6px;
}

.section-desc{
color:#91a7c1;
margin:0 0 20px;
}

.stat-row{
display:grid;
grid-template-columns:150px 1fr 65px;
align-items:center;
gap:10px;
margin:9px 0;
}

.stat-row label{
color:#a7bad0;
font-size:12px;
}

.stat-value{
text-align:right;
font-weight:800;
}

.mini-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:8px;
}

.mini{
background:#0b192b;
border:1px solid #213a5a;
border-radius:10px;
padding:10px;
}

.mini small{
display:block;
color:#839ab3;
font-size:10px;
}

.mini strong{
display:block;
margin-top:3px;
}

.news{
cursor:pointer;
transition:.15s;
}

.news:hover{
transform:translateY(-2px);
border-color:#4389bb;
background:#172c48;
}

.news-tag{
display:inline-block;
font-size:10px;
font-weight:900;
padding:4px 7px;
border-radius:6px;
background:#253c5b;
color:#8edcff;
margin-bottom:7px;
}

.news-title{
font-weight:900;
line-height:1.5;
}

.news-body{
color:#91a7c1;
font-size:12px;
margin-top:6px;
line-height:1.6;
}

.politician{
position:relative;
overflow:hidden;
}

.politician:before{
content:"";
position:absolute;
top:0;
left:0;
right:0;
height:4px;
background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
}

.pol-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
}

.pol-name{
font-size:18px;
font-weight:950;
}

.pol-meta{
color:#8ca3bc;
font-size:11px;
margin-top:3px;
}

.pol-bars{
margin-top:14px;
}

.pol-actions{
margin-top:14px;
display:flex;
flex-wrap:wrap;
gap:7px;
}

.pol-actions .btn{
font-size:11px;
padding:8px 10px;
}

.tag{
padding:4px 7px;
border-radius:6px;
font-size:10px;
font-weight:900;
background:#223853;
color:#b4c8df;
}

.tag.leader{
color:#ffe77a;
background:rgba(255,227,110,.13);
}

.tag.senior{
color:#d2baff;
background:rgba(155,108,255,.13);
}

.tag.young{
color:#71edc0;
background:rgba(69,223,154,.13);
}

.table{
width:100%;
border-collapse:collapse;
}

.table th,
.table td{
padding:10px 8px;
border-bottom:1px solid rgba(255,255,255,.07);
text-align:left;
font-size:12px;
}

.table th{
color:#91a9c3;
font-weight:800;
}

.party-pill{
display:inline-flex;
padding:4px 7px;
border-radius:6px;
background:#233b59;
color:#b9d0e8;
font-size:10px;
font-weight:900;
}

.map{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:8px;
}

@media(max-width:800px){
.map{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.district{
min-height:110px;
padding:10px;
border-radius:12px;
background:
linear-gradient(145deg,#132b47,#0d1d32);
border:1px solid #294867;
cursor:pointer;
transition:.15s;
}

.district:hover{
transform:translateY(-2px);
border-color:#49d9ff;
}

.district.selected{
border-color:#ffd45c;
box-shadow:0 0 0 2px rgba(255,212,92,.15);
}

.district-name{
font-weight:900;
font-size:13px;
}

.district-small{
color:#8199b3;
font-size:10px;
margin-top:5px;
}

.district-candidate{
color:#77e8ff;
font-size:11px;
margin-top:8px;
}

.modal{
position:fixed;
inset:0;
z-index:100;
background:rgba(1,7,14,.76);
backdrop-filter:blur(7px);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.modal.hidden{
display:none;
}

.modal-box{
width:min(850px,100%);
max-height:90vh;
overflow:auto;
background:
linear-gradient(145deg,#172b47,#0d1b30);
border:1px solid #426586;
border-radius:18px;
box-shadow:0 30px 80px rgba(0,0,0,.5);
padding:22px;
}

.modal-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:16px;
}

.modal-title{
font-size:21px;
font-weight:950;
}

.close{
width:38px;
height:38px;
border-radius:50%;
background:#263d5b;
border:1px solid #426080;
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

@media(max-width:650px){
.form-grid{grid-template-columns:1fr}
}

.field label{
display:block;
font-size:11px;
color:#93aac3;
margin-bottom:6px;
}

.notice{
padding:12px;
border-radius:11px;
background:rgba(32,217,255,.07);
border:1px solid rgba(32,217,255,.18);
color:#b5eefd;
font-size:12px;
line-height:1.7;
}

.warning{
padding:12px;
border-radius:11px;
background:rgba(255,173,66,.08);
border:1px solid rgba(255,173,66,.2);
color:#ffd393;
font-size:12px;
line-height:1.7;
}

.danger{
padding:12px;
border-radius:11px;
background:rgba(255,93,108,.08);
border:1px solid rgba(255,93,108,.2);
color:#ffabb3;
font-size:12px;
line-height:1.7;
}

.success{
padding:12px;
border-radius:11px;
background:rgba(69,223,154,.08);
border:1px solid rgba(69,223,154,.2);
color:#9af4c9;
font-size:12px;
line-height:1.7;
}

.toast{
position:fixed;
right:18px;
bottom:18px;
z-index:200;
max-width:380px;
background:#10233a;
border:1px solid #3b668d;
padding:13px 16px;
border-radius:12px;
box-shadow:0 15px 40px rgba(0,0,0,.4);
transform:translateY(30px);
opacity:0;
pointer-events:none;
transition:.2s;
font-size:12px;
}

.toast.show{
transform:translateY(0);
opacity:1;
}

.start{
max-width:1050px;
margin:40px auto;
}

.start-hero{
padding:35px;
border-radius:24px;
background:
radial-gradient(circle at 15% 20%,rgba(32,217,255,.22),transparent 30%),
radial-gradient(circle at 85% 15%,rgba(241,91,181,.2),transparent 28%),
linear-gradient(145deg,#132a48,#211a40);
border:1px solid rgba(130,190,240,.3);
box-shadow:0 25px 70px rgba(0,0,0,.35);
margin-bottom:20px;
}

.start-hero h1{
font-size:42px;
line-height:1.15;
margin:0 0 12px;
}

@media(max-width:600px){
.start-hero h1{font-size:30px}
}

.start-hero p{
color:#b0c4da;
line-height:1.8;
}

.climate{
border-radius:18px;
padding:18px;
background:
linear-gradient(
110deg,
rgba(45,105,255,.28),
rgba(245,245,245,.10) 50%,
rgba(255,75,75,.28)
);
border:1px solid rgba(255,255,255,.15);
}

.timeline{
display:flex;
gap:5px;
overflow-x:auto;
padding-bottom:5px;
}

.timeline-item{
min-width:100px;
background:#0b192b;
border:1px solid #213a58;
border-radius:9px;
padding:9px;
}

.timeline-item strong{
display:block;
font-size:11px;
}

.timeline-item span{
color:#7991ac;
font-size:10px;
}

.empty{
color:#7188a2;
padding:20px;
text-align:center;
}

.hr{
height:1px;
background:rgba(255,255,255,.07);
margin:17px 0;
}

.center{
text-align:center;
}

.right{
text-align:right;
}

.flex{
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

.space{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
}

.small{
font-size:11px;
color:#8198b1;
}

.big-number{
font-size:34px;
font-weight:950;
}

.start-party-card{
cursor:pointer;
transition:.15s;
}

.start-party-card:hover{
transform:translateY(-3px);
border-color:#45d9ff;
}

.start-party-card.selected{
border-color:#ffd45c;
box-shadow:0 0 0 2px rgba(255,212,92,.15);
}

.role-select{
min-width:200px;
}

</style>
</head>

<div class="header-inner">

<div class="nav-wrap" id="navWrap" style="display:none;">

</header>

<main class="main" id="main"></main>

</div>

<div class="toast" id="toast"></div>

<div class="modal hidden" id="modal">

/* ---------------------------------------------------------
基本ユーティリティ
--------------------------------------------------------- */

function rnd(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}

function clamp(v,min,max){
return Math.max(min,Math.min(max,v));
}

function choice(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function esc(v){
return String(v ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function partyById(id){
return state?.parties?.find(p=>p.id===id);
}

function politicianById(id){
return state?.politicians?.find(p=>p.id===id);
}

function isLeader(){
if(!state.started || !state.player) return false;
const p=partyById(state.player.partyId);
return !!p && p.leaderId==="player";
}

function isPM(){
return isLeader() && state.governmentPartyId===state.player.partyId;
}

function playerPolitician(){
return politicianById("player");
}

function actionLeft(){
return 4-state.monthActions;
}

function showToast(text){
const el=document.getElementById("toast");
el.textContent=text;
el.classList.add("show");
clearTimeout(window.__toastTimer);
window.__toastTimer=setTimeout(()=>{
el.classList.remove("show");
},2600);
}

function saveGame(silent=true){
try{
localStorage.setItem(SAVE_KEY,JSON.stringify(state));
if(!silent) showToast("セーブしました。");
return true;
}catch(e){
if(!silent) showToast("セーブに失敗しました。");
return false;
}
}

function loadGame(){
try{
const raw=localStorage.getItem(SAVE_KEY);
if(!raw){
showToast("セーブデータはありません。");
return false;
}
const loaded=JSON.parse(raw);
if(!loaded || !loaded.version || !loaded.started){
throw new Error("invalid");
}
state=loaded;
normalizeState();
render();
showToast("セーブデータを読み込みました。");
return true;
}catch(e){
console.error(e);
showToast("ロードに失敗しました。セーブデータを初期化して開始できます。");
return false;
}
}

function buildInitialParties(){
return BASE_PARTIES.map(p=>({
...p,
support:0,
membersCount:rnd(25000,180000),
leaderId:null,
coalition:false
}));
}

function calculateInitialSupports(parties){
const climate=52+rnd(-10,10);

parties.forEach(p=>{
const distance=Math.abs(p.ideology-climate);
let base;

if(p.id==="ldp") base=rnd(27,35);
else if(p.id==="cra") base=rnd(7,13);
else if(p.id==="ishin") base=rnd(6,11);
else if(p.id==="dpp") base=rnd(5,9);
else if(p.id==="sanseito") base=rnd(2,6);
else if(p.id==="mirai") base=rnd(1,4);
else if(p.id==="jcp") base=rnd(1,4);
else base=rnd(1,3);

const compatibility=clamp(1-distance/70,.45,1);
p.support=Number(clamp(base*compatibility,.5,40).toFixed(1));
});

const sum=parties.reduce((a,p)=>a+p.support,0);
const scale=82/sum;

parties.forEach(p=>{
p.support=Number((p.support*scale).toFixed(1));
});

return climate;
}

"政党",

playerName+"を党首として新党が発足した。国政議席はまだない。",
"politics"
);

state.tab="home";
saveGame();
}

function addPartyMembers(count){
const party=partyById(state.player.partyId);

for(let i=0;i<Math.min(count,20);i++){
state.members.push({
id:"recruit_"+Date.now()+"_"+i,
name:randomMemberName(),
partyId:party.id,
age:rnd(20,70),
status:"一般党員",
politicianId:null,
activity:rnd(30,75)
});
}
}

/* ---------------------------------------------------------
支持率
--------------------------------------------------------- */

function partySupportChange(id,delta){
const p=partyById(id);
if(!p)return;
p.support=clamp(Number((p.support+delta).toFixed(1)),.2,45);
normalizeSupport();
}

function normalizeSupport(){
const total=state.parties.reduce((a,p)=>a+p.support,0);

if(total>92){
const scale=92/total;
state.parties.forEach(p=>{
p.support=Number((p.support*scale).toFixed(1));
});
}
}

function publishSupport(){
state.supportPublication={};

state.parties.forEach(p=>{
state.supportPublication[p.id]=p.support;
});

addNews(
"世論調査",
"最新政党支持率が公表",
state.parties
.sort((a,b)=>b.support-a.support)
.slice(0,5)
.map(p=>p.short+" "+p.support.toFixed(1)+"%")
.join(" / "),
"economy"
);
}

function runAutoActions(){
if(!state.autoMode || !state.policyDirection)return;

while(state.monthActions<4){
switch(state.policyDirection){
case "メディア重視":
autoMedia();
break;
case "地元重視":
autoLocal();
break;
case "党勢拡大":
autoParty();
break;
case "政策研究":
autoStudy();
break;
case "人脈構築":
autoNetwork();
break;
default:
autoBalance();
}
}
}

function autoMedia(){
state.monthActions++;
const gain=rnd(2,5);
state.player.recognition=clamp(state.player.recognition+gain,0,100);
state.player.personalSupport=clamp(state.player.personalSupport+gain*.15,0,100);
const party=partyById(state.player.partyId);
const recruit=Math.max(5,Math.floor(party.membersCount*gain/1200));
party.membersCount+=recruit;
addPartyMembers(recruit);
}

function autoLocal(){
state.monthActions++;
state.player.internalSupport=clamp(state.player.internalSupport+1.5,0,100);
state.player.personalSupport=clamp(state.player.personalSupport+.15,0,100);
}

function autoParty(){
state.monthActions++;
const party=partyById(state.player.partyId);
const recruit=Math.max(10,Math.floor(party.membersCount*.004));
party.membersCount+=recruit;
addPartyMembers(recruit);
state.player.internalSupport=clamp(state.player.internalSupport+1.2,0,100);
}

function autoStudy(){
state.monthActions++;
const p=playerPolitician();
p.policy=clamp(p.policy+2,0,100);
p.execution=clamp(p.execution+1,0,100);
}

function autoNetwork(){
state.monthActions++;
const people=state.politicians
.filter(p=>p.id!=="player" && p.active && !p.retired)
.sort((a,b)=>
(state.relationships[a.id]?.familiarity||0)-
(state.relationships[b.id]?.familiarity||0)
);

const p=people[0];
if(p){
const r=state.relationships[p.id];
r.familiarity=clamp(r.familiarity+3,0,100);
r.trust=clamp(r.trust+1,0,100);
}
}

function autoBalance(){
state.monthActions++;
if(state.monthActions%2===0) autoMedia();
else autoLocal();
}

relationshipTick();

generateMonthlyNews();

possibleForeignMeeting();
possibleOpinionEvent();

function relationshipTick(){
Object.values(state.relationships).forEach(r=>{
if(r.cooldown>0) r.cooldown--;
});
}

function meetingChance(p){
const r=state.relationships[p.id];
if(!r)return 0;

let score=
r.familiarity*.28+
r.trust*.25+
r.respect*.18+
state.player.reputation*.12+
playerPolitician().organization*.08+
playerPolitician().popularity*.09;

if(p.senior) score-=18;

if(r.introduced) score+=15;

return clamp(score,0,100);
}

function requestMeeting(id){
const p=politicianById(id);

if(!p || id==="player")return;

const r=state.relationships[id];

if(r.cooldown>0){
showToast("まだ面会の間隔が空いていません。");
return;
}

const chance=meetingChance(p);

openModal(
"政治家との面会",
`
<div class="card" style="padding:14px">
<div class="pol-name">${esc(p.name)}</div>
<div class="pol-meta">${esc(p.group)} / ${esc(partyById(p.partyId)?.name||"")}</div>

<div style="margin-top:12px">
${statLine("面会成功率",chance)}
</div>

<div class="notice" style="margin-top:12px">
重鎮ほど面会難易度が高くなります。
紹介、人望、信頼、実績、知名度などで成功率が上がります。
</div>
</div>
`,
`
<button type="button" class="btn primary"
data-action="execute-meeting" data-id="${id}">
面会を申し込む
</button>
<button type="button" class="btn dark" data-action="close-modal">
キャンセル
</button>
`
);
}

function executeMeeting(id){
const p=politicianById(id);
const r=state.relationships[id];

closeModal();

if(Math.random()*100 < meetingChance(p)){
r.familiarity=clamp(r.familiarity+rnd(5,10),0,100);
r.trust=clamp(r.trust+rnd(2,7),0,100);
r.respect=clamp(r.respect+rnd(1,4),0,100);
r.favor=clamp(r.favor+rnd(0,3),0,100);
r.meetings++;
r.cooldown=p.senior?3:1;

state.player.internalSupport=clamp(
state.player.internalSupport+(p.partyId===state.player.partyId?1.5:.5),
0,100
);

showToast(p.name+"との面会に成功しました。");
}else{
r.cooldown=p.senior?2:1;
showToast(p.name+"との面会は見送られました。");
}

saveGame();
render();
}

function introduce(id){
const p=politicianById(id);
const r=state.relationships[id];

const intermediaries=state.politicians
.filter(x=>
x.id!=="player" &&
x.id!==id &&
x.active &&
state.relationships[x.id]?.familiarity>45
)
.sort((a,b)=>
(state.relationships[b.id]?.respect||0)-
(state.relationships[a.id]?.respect||0)
);

if(!intermediaries.length){
showToast("まだ紹介を頼める政治家がいません。");
return;
}

const inter=intermediaries[0];

r.introduced=true;
r.familiarity=clamp(r.familiarity+8,0,100);
r.trust=clamp(r.trust+5,0,100);

addNews(
"人脈",
inter.name+"の紹介で"+p.name+"との接点が生まれた",
"紹介を通じて新たな政治的人脈が形成された。",
"politics"
);

saveGame();
render();
showToast(inter.name+"の紹介で"+p.name+"へのアクセスが改善しました。");
}

(state.year===state.leaderTermEnd.year &&
state.month>=state.leaderTermEnd.month))){

}

state.year>=2027 &&
state.month===3 &&

function leadRun(){
const c=state.partyLeadershipElection.candidates.find(x=>x.id==="player");

function leadVote(id){
const e=state.partyLeadershipElection;

e.candidates.forEach(c=>c.votes=0);

const selected=e.candidates.find(c=>c.id===id);
if(!selected)return;

selected.votes++;

e.candidates.forEach(c=>{
const p=politicianById(c.id);
if(!p)return;

const base=
p.humanity*.25+
p.organization*.22+
p.popularity*.2+
p.execution*.15+
p.recognition*.08+
p.ambition*.1;

const votes=Math.max(1,Math.round(base/12+rnd(0,5)));
c.votes+=votes;
});

const winner=[...e.candidates].sort((a,b)=>b.votes-a.votes)[0];
const party=partyById(state.player.partyId);

party.leaderId=winner.id;

if(winner.id==="player"){
state.leaderTermEnd={
year:state.year+4,
month:state.month
};

state.player.internalSupport=clamp(
state.player.internalSupport+10,
0,100
);

addNews(
"政局",
state.player.name+"が党首に就任",
"党首選挙を制し、新たな党首となった。",
"politics"
);

showToast("党首選挙に勝利しました！");
}else{
addNews(
"政局",
winner.name+"が党首に選出",
winner.name+"が党首選挙を制した。",
"politics"
);

showToast(winner.name+"が党首に選出されました。");
}

state.partyLeadershipElection=null;
saveGame();
render();
}

function runLowerElection(){

const party=partyById(state.player.partyId);

if(state.year<e.nextLowerYear){

);
return;

confirmLowerElection();

function confirmLowerElection(){
const e=state.election;
const party=partyById(state.player.partyId);

let districtWins=0;

Object.entries(e.districts).forEach(([name,d])=>{
if(!d.candidate)return;

const c=politicianById(d.candidate);
if(!c)return;

const score=
party.support+
c.popularity*.35+
c.organization*.2+
c.recognition*.15+
c.humanity*.1+
rnd(-12,12);

const opponentScore=
rnd(30,60)+rnd(-8,8);

if(score>opponentScore){
districtWins++;
}
});

const prSeats=Math.round(
clamp(
party.support/100*120,
0,20
)
);

party.seatsL=districtWins+prSeats;

if(party.seatsL<1 && party.support>2 && Math.random()<.3){
party.seatsL=1;
}

if(party.seatsL>0){
const pp=politicianById("player");

if(pp.house==="none"){
pp.house="lower";
pp.district="比例";
state.player.house="lower";
}
}

e.lastResult={
type:"衆議院選挙",
lower:districtWins,
pr:prSeats
};

e.nextLowerYear=state.year+4;

addNews(
"選挙",
"衆議院選挙が実施された",
party.name+"は小選挙区"+districtWins+"議席、比例"+prSeats+"議席を獲得した。",
"politics"
);

closeModal();
saveGame();
render();

showToast("衆院選終了。"+party.name+"は"+party.seatsL+"議席。");
}

function runUpperElection(){
const party=partyById(state.player.partyId);

const seats=Math.round(
clamp(party.support/100*30,0,12)
);

party.seatsU=seats;

const pp=politicianById("player");

if(
state.player.house==="none" &&
state.election.upperPR.includes("player")
){
pp.house="upper";
state.player.house="upper";
}

state.election.lastResult={
type:"参議院選挙",
lower:0,
pr:seats
};

state.election.nextUpperYear=state.year+3;

addNews(
"選挙",

);

}

function billVote(vote){
if(state.diet.bill.playerVote){
showToast("すでに投票しています。");
return;

state.diet.bill.playerVote=vote;
saveGame();

function resolveBill(){
const b=state.diet.bill;

if(!b.playerVote){
showToast("まずあなたの投票を選択してください。");
return;
}

let yes=0;
let no=0;

state.parties.forEach(p=>{
const distance=Math.abs(p.ideology-state.climate);

let probability;

if(p.id===state.governmentPartyId){
probability=.68;
}else{
probability=.5;
}

probability+=
(50-distance)*.002;

if(Math.random()<probability){
yes+=p.seatsL;
}else{
no+=p.seatsL;
}
});

if(state.player.house==="lower"){
if(b.playerVote==="support") yes++;
if(b.playerVote==="oppose") no++;
}

const passed=yes>no;

openModal(
"採決結果",
`
<div class="${passed?"success":"danger"}">
<div class="big-number">${passed?"可決":"否決"}</div>
<p>
賛成 ${yes}議席 / 反対 ${no}議席
</p>
</div>

<div class="notice" style="margin-top:12px">
あなた一人の投票ではなく、各党の議席数と党方針をもとに判定されています。
</div>
`,
`
<button type="button" class="btn primary" data-action="close-modal">
閉じる
</button>
`
);

state.diet.bill=null;
saveGame();
}

function evaluatePolicy(){
const p=state.player.policy;

const fiscal=(
(p.economy*.25)+
(p.healthcare*.25)+
(p.security*.2)+
(p.immigration*.1)+
(p.nuclear*.1)+
(p.diplomacy*.1)
);

const growth=clamp(
p.economy*.4+
p.nuclear*.15+
p.diplomacy*.1+
(100-p.immigration)*.05,
0,100
);

const feasibility=
playerPolitician().execution*.5+
playerPolitician().policy*.5;

const burden=clamp(fiscal,0,100);

let text="";

if(growth>70) text+="成長押上げ効果は比較的強い。";
else if(growth<40) text+="成長押上げ効果は限定的。";
else text+="成長への効果は中程度。";

if(burden>70) text+=" 一方で財政負担には注意が必要。";
else if(burden<40) text+=" 財政負担は比較的小さい。";

if(feasibility>75) text+=" 政策実行力は高い。";
else if(feasibility<50) text+=" 実行段階での調整が課題。";

openModal(
"政策評価AI",
`
<div class="grid grid-3">
<div class="mini">
<small>成長効果</small>
<strong>${growth.toFixed(0)}</strong>
</div>
<div class="mini">
<small>財政負担</small>
<strong>${burden.toFixed(0)}</strong>
</div>
<div class="mini">
<small>実行可能性</small>
<strong>${feasibility.toFixed(0)}</strong>
</div>
</div>

<div class="notice" style="margin-top:14px">
${text}
</div>
`
);
}

saveGame();
render();
showToast("ニュースを更新しました。");
break;

case "news-detail":{
const index=Number(button.dataset.id);
const n=state.news[index];

if(n){
openModal(
esc(n.title),
`
<span class="news-tag">${esc(n.category)}</span>
<p style="line-height:1.9;color:#b8c9dc">
${esc(n.summary)}
</p>

<div class="mini-grid">
<div class="mini">
<small>カテゴリ</small>
<strong>${esc(n.category)}</strong>
</div>
<div class="mini">
<small>日付</small>
<strong>${esc(n.date||"")}</strong>
</div>
</div>

${n.category==="ゲーム内シナリオ"?`
<div class="warning" style="margin-top:14px">
これはゲーム内で生成されたシナリオです。
現実の報道ではありません。
</div>
`:""}
`
);
}

break;
}

case "close-modal":
closeModal();
break;

case "save":
saveGame(false);
break;

case "load":
loadGame();
break;

case "reset":
openModal(
"ゲームを初期化しますか？",
`
<div class="danger">
現在のセーブデータを上書きして新しいゲーム画面に戻ります。
</div>
`,
`
<button type="button" class="btn red" data-action="confirm-reset">
初期化する
</button>
<button type="button" class="btn dark" data-action="close-modal">
キャンセル
</button>
`
);
break;

case "confirm-reset":
localStorage.removeItem(SAVE_KEY);
state=null;
closeModal();
render();
showToast("ゲームを初期化しました。");
break;

case "button-test":
openModal(
"ボタン動作テスト",
`
<div class="success">
ボタンは正常にイベントを受け取っています。
<br><br>
この画面が開いている時点で、
「ボタン → イベント委譲 → 処理」の接続は正常です。
</div>
`
);
break;
}

}catch(error){
console.error(error);

showToast(
"処理中にエラーが発生しました。データは保護されています。"
);
}
});

/* ---------------------------------------------------------
モーダル背景クリック
--------------------------------------------------------- */

document.getElementById("modal").addEventListener("click",function(e){
if(e.target===this){
closeModal();
}
});

/* ---------------------------------------------------------
キーボード
--------------------------------------------------------- */

document.addEventListener("keydown",function(e){
if(e.key==="Escape"){
closeModal();
}
});

/* ---------------------------------------------------------
気候背景
--------------------------------------------------------- */

function updateClimateBackground(){
const main=document.getElementById("main");

if(!state || !state.started)return;

let bg;

if(state.climate<40){
bg=`
radial-gradient(circle at 5% 15%,rgba(55,100,255,.17),transparent 35%),
radial-gradient(circle at 90% 80%,rgba(60,150,255,.12),transparent 30%)
`;
}else if(state.climate>60){
bg=`
radial-gradient(circle at 95% 10%,rgba(255,70,80,.18),transparent 35%),
radial-gradient(circle at 10% 85%,rgba(255,130,60,.10),transparent 30%)
`;
}else{
bg=`
radial-gradient(circle at 50% 0%,rgba(245,245,255,.07),transparent 35%),
radial-gradient(circle at 90% 90%,rgba(32,217,255,.08),transparent 30%)
`;
}

main.style.background=bg;
main.style.borderRadius="25px";
}

/* ---------------------------------------------------------
起動
--------------------------------------------------------- */

let state=null;

window.addEventListener("load",function(){
try{
const raw=localStorage.getItem(SAVE_KEY);

if(raw){
const parsed=JSON.parse(raw);

if(parsed && parsed.started){
state=parsed;
normalizeState();
render();
return;
}
}
}catch(e){
console.warn("セーブデータの自動読み込みをスキップ:",e);
}

state={
started:false
};

render();
});

</script>
