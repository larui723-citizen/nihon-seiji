<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>日本政局 TEST</title>

<style>
body {
    font-family: sans-serif;
    background: #eef1f5;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.box {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
}

button {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: none;
    border-radius: 10px;
    background: #27333e;
    color: white;
    font-size: 18px;
}

button:active {
    transform: scale(0.98);
}

.stat {
    font-size: 20px;
    margin: 20px 0;
}

#game {
    display: none;
}

#message {
    margin-top: 20px;
    padding: 15px;
    background: #f1f3f5;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="box">

<div id="start">

<h1>🇯🇵 日本政局</h1>

<p>政治シミュレーション・テスト版</p>

<button type="button" onclick="startGame()">
🎮 ゲーム開始
</button>

</div>


<div id="game">

<h1>🇯🇵 日本政局</h1>

<div class="stat">
📅 <span id="date">2026年1月</span>
</div>

<div class="stat">
📊 支持率：<span id="support">20</span>%
</div>

<div class="stat">
⚡ 今月の行動：<span id="actions">4</span>/4
</div>


<button type="button" onclick="speech()">
🎤 街頭演説
</button>

<button type="button" onclick="nextMonth()">
➡️ 翌月へ進む
</button>

<div id="message">
ゲームを開始してください。
</div>

</div>

</div>


<script>

let year = 2026;
let month = 1;
let support = 20;
let actions = 4;


/* ゲーム開始 */

function startGame() {

    document.getElementById("start").style.display = "none";

    document.getElementById("game").style.display = "block";

    document.getElementById("message").textContent =
        "ゲーム開始！街頭演説をしてみよう。";

}


/* 街頭演説 */

function speech() {

    if (actions <= 0) {

        document.getElementById("message").textContent =
            "今月の行動回数を使い切りました。";

        return;

    }

    actions--;

    support += 1;

    document.getElementById("support").textContent =
        support;

    document.getElementById("actions").textContent =
        actions;

    document.getElementById("message").textContent =
        "🎤 街頭演説を行いました。支持率が1ポイント上昇しました。";

}


/* 翌月 */

function nextMonth() {

    year++;

    if (month >= 12) {

        month = 1;

    } else {

        month++;

    }

    actions = 4;

    document.getElementById("date").textContent =
        year + "年" + month + "月";

    document.getElementById("actions").textContent =
        actions;

    document.getElementById("message").textContent =
        "📅 新しい月になりました。行動回数が4回に戻りました。";

}

</script>

</body>
</html>
