<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>日本政局</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
background:#eef1f5;
color:#222;
}

header{
background:#17212b;
color:#fff;
padding:16px;
text-align:center;
position:sticky;
top:0;
z-index:10;
}

header h1{
margin:0;
font-size:22px;
}

main{
max-width:900px;
margin:auto;
padding:12px;
}

.card{
background:#fff;
padding:16px;
margin-bottom:12px;
border-radius:14px;
box-shadow:0 2px 7px rgba(0,0,0,.08);
}

button{
display:inline-block;
border:0;
border-radius:10px;
padding:12px 15px;
margin:4px;
background:#263541;
color:#fff;
font-size:15px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

button:disabled{
opacity:.4;
cursor:not-allowed;
}

input,textarea,select{
width:100%;
padding:11px;
margin:5px 0 12px;
border:1px solid #ccd2d8;
border-radius:9px;
font-size:15px;
}

textarea{
min-height:120px;
}

.hidden{
display:none!important;
}

.stat{
display:inline-block;
padding:8px 10px;
margin:3px;
border-radius:9px;
background:#edf0f3;
}

.tabs{
display:flex;
overflow-x:auto;
gap:4px;
margin-bottom:12px;
}

.tabs button{
white-space:nowrap;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

.bar{
height:15px;
background:#ddd;
border-radius:20px;
overflow:hidden;
}

.bar div{
height:100%;
background:#333;
width:0%;
transition:.3s;
}

.news{
background:#f4f5f6;
padding:11px;
margin:7px 0;
border-radius:8px;
border-left:4px solid #555;
}

.good{
border-left-color:#287b42;
}

.bad{
border-left-color:#a52a2a;
}

.warn{
border-left-color:#a36b16;
}

.badge{
display:inline-block;
background:#e7eaed;
border-radius:6px;
padding:4px 7px;
margin:2px;
font-size:12px;
}

.politician{
border:1px solid #ddd;
padding:12px;
margin:8px 0;
border-radius:10px;
}

.small{
font-size:13px;
color:#666;
}

.center{
text-align:center;
}

@media(max-width:600px){
button{
width:calc(50% - 10px);

<option value="社会民主党">社会民主党</option>
<option value="new">新しい政党を作る</option>

</select>

<!-- ================= HOME ================= -->

<section id="home" class="panel active">

<div class="bar">

</div>

<p id="supportText"></p>

</div>

<h2>現在の政治状況</h2>

</div>

</button>

</button>

</section>


<!-- ================= ACTIONS ================= -->

<section id="actionsPanel" class="panel">

<div class="card">

<h2>政治活動</h2>

<p class="small">
1か月に最大4回まで行動できます。
</p>

<button type="button" data-action="speech">
街頭演説
</button>

<button type="button" data-action="media">
メディア出演
</button>

<button type="button" data-action="parliament">
国会活動

<button type="button" data-action="party">

<button type="button" data-action="diplomacy">

</button>

<button type="button" data-action="local">

</button>

</div>

</section>


<!-- ================= POLICY ================= -->

<section id="policyPanel" class="panel">

政策を文章で入力してください。

<div class="card">

</section>


<!-- ================= POLITICIANS ================= -->

<section id="politicianPanel" class="panel">

<div class="card">

<p class="small">

</section>

<section id="partyPanel" class="panel">

<!-- ================= NEWS ================= -->

<section id="newsPanel" class="panel">

<div class="card">

<h2>政局ニュース</h2>

<div id="news"></div>

</div>

</section>

</section>

</main>

/* =====================================================
HELPER
===================================================== */

function clamp(value,min,max){

return Math.max(min,Math.min(max,value));

}


/* =====================================================
START
===================================================== */

function startGame(){

const selected=
document.getElementById("partySelect").value;

if(selected==="new"){

game.party=
document.getElementById("newPartyName").value.trim()
||"日本未来党";

game.leader=
document.getElementById("playerName").value.trim()
||"プレイヤー";

game.philosophy=
document.getElementById("philosophy").value.trim()
||"独自路線";

game.support=8;
game.seats=0;
game.governing=false;

}else{

game.party=selected;

game.leader=parties[selected].leader;

game.philosophy=parties[selected].ideology;

game.support=parties[selected].support;

game.seats=parties[selected].seats;

/*
ゲーム開始時の自由民主党は与党扱い。
*/

game.governing=
game.party==="自由民主党";

}

document.getElementById("setup")
.classList.add("hidden");

document.getElementById("game")
.classList.remove("hidden");

addNews(
game.party+"で政治活動を開始しました。"
);

updateUI();

}


/* =====================================================

===================================================== */

function showPanel(id){

document
.querySelectorAll(".panel")
.forEach(panel=>{
panel.classList.remove("active");
});

const target=document.getElementById(id);

if(target){
target.classList.add("active");
}

}


/* =====================================================
ACTION
===================================================== */

function doAction(type){

if(game.actions<=0){

alert("今月の行動回数は4回までです。");

return;

}

game.actions--;

game.lastActions[type]=
(game.lastActions[type]||0)+1;

const repetition=
game.lastActions[type];

const diminishing=
Math.max(
0.2,
1-(repetition-1)*0.2
);

let message="";


if(type==="speech"){

const gain=
0.5*diminishing;

game.support+=gain;

message=
"街頭演説を行いました。支持率が"+
gain.toFixed(1)+
"ポイント上昇しました。";

}


if(type==="media"){

const gain=
0.6*diminishing;

game.support+=gain;

message=
"メディア出演を行いました。";

}


if(type==="parliament"){

game.base+=
1.5*diminishing;

game.politicalCapital+=2;

message=
"国会活動を行いました。";

}


if(type==="party"){

game.base+=
4*diminishing;

game.scandalProtection+=
3*diminishing;

message=
"党内基盤を強化しました。";

}


if(type==="education"){

game.base+=
1*diminishing;

game.scandalProtection+=
5*diminishing;

message=
"党内教育を行いました。不祥事への耐性が上昇しました。";

}


if(type==="diplomacy"){

game.diplomacy+=
3*diminishing;

if(game.governing){

game.support+=
0.4*diminishing;

}

message=
"外交活動を行いました。";

}


if(type==="local"){

game.base+=
1*diminishing;

game.support+=
0.3*diminishing;

message=
"地方活動を行いました。";

}


addNews(message,"good");

updateUI();

}

function nextMonth(){

if(game.actions>0){

const ok=
confirm(
"今月の行動が"+
game.actions+
"回残っています。翌月へ進みますか？"
);

if(!ok)return;

}

game.month++;

if(game.month>12){

game.month=1;

game.year++;

yearlyUpdate();

}

game.actions=4;

game.lastActions={};

monthlyEconomy();

monthlyPolitics();

randomEvent();

processPolicies();

processPromises();

npcPolitics();

checkElection();

updateUI();

}


/* =====================================================
ECONOMY
===================================================== */

function monthlyEconomy(){

const economyChange=
(Math.random()-0.5)*3;

game.economy=
clamp(
game.economy+economyChange,
0,
100
);

const priceChange=
(Math.random()-0.4)*2;

game.prices=
clamp(
game.prices+priceChange,
0,
100
);


/*
経済好調
*/

if(game.economy>65){

if(game.governing){

game.support+=0.8;

addNews(
"景気が改善し、与党への評価が上昇しました。",
"good"
);

}else{

game.support-=0.2;

}

}


/*
経済停滞
*/

if(game.economy<35){

if(game.governing){

game.support-=1.0;

addNews(
"景気停滞への不満が政府に向かっています。",
"bad"
);

}else{

game.support+=0.5;

}

}


/*
物価
*/

if(game.prices>70){

if(game.governing){

game.support-=0.8;

addNews(
"物価高への不満が政府に向かっています。",
"bad"
);

}else{

game.support+=0.2;

}

}

}


/* =====================================================
POLITICS
===================================================== */

function monthlyPolitics(){

if(game.governing){

game.support+=
(game.diplomacy-50)*0.005;

}else{

if(game.economy<40){

game.support+=0.2;

}

}

game.support=
clamp(game.support,0,100);

}


/* =====================================================
EVENTS
===================================================== */

function randomEvent(){

const r=Math.random();


/*
重大不祥事
*/

const scandalChance=
0.035*
Math.max(
0.15,
1-game.scandalProtection/120
);

if(r<scandalChance){

const damage=
15+Math.random()*15;

game.support-=damage;

game.base-=5;

addNews(
"重大な政治資金問題が発覚しました。支持率が大幅に低下しました。",
"bad"
);

return;

}


/*
海外戦争
*/

if(r<0.09){

addNews(

/* =====================================================
POLICY
===================================================== */

function evaluatePolicy(){

const text=
document.getElementById("policyInput")
.value.trim();

if(!text){

alert("政策を入力してください。");

return;

}

let economy=0;
let welfare=0;
let education=0;
let defense=0;
let environment=0;
let diplomacy=0;
let fiscal=50;


if(
text.includes("減税")||
text.includes("消費税減税")||
text.includes("税を下げ")
){

economy+=12;
fiscal-=8;

}


if(
text.includes("増税")||
text.includes("税率を上げ")
){

fiscal+=10;
economy-=4;

}


if(
text.includes("給付")||
text.includes("社会保障")||
text.includes("年金")||
text.includes("医療")
){

welfare+=12;
fiscal-=8;

}


if(
text.includes("教育")||
text.includes("子育て")||
text.includes("若者")
){

education+=12;

}


if(
text.includes("防衛")||
text.includes("自衛隊")||
text.includes("安全保障")
){

defense+=12;
fiscal-=7;

}


if(
text.includes("環境")||
text.includes("脱炭素")||
text.includes("再生可能")||
text.includes("原発")
){

environment+=10;

}


if(
text.includes("外交")||
text.includes("条約")||
text.includes("首脳会談")
){

diplomacy+=10;

}


const total=
economy+
welfare+
education+
defense+
environment+
diplomacy;


const feasibility=
clamp(
Math.round(
55+
total*0.6+
(fiscal-50)*0.3
),
15,
95
);


let html=
"<div class='news'>"+
"<b>政策評価</b><br><br>"+
"経済："+economy+"<br>"+
"社会保障："+welfare+"<br>"+
"教育・子育て："+education+"<br>"+
"防衛："+defense+"<br>"+
"環境："+environment+"<br>"+
"外交："+diplomacy+"<br>"+
"財政評価："+fiscal+"/100<br>"+
"実現可能性："+feasibility+"%"+
"</div>";


if(feasibility>=65){

html+=
"<div class='news good'>"+
"採用候補になりやすい政策です。"+
"</div>";

game.activePolicies.push({

text:text,

delay:3,

impact:
Math.max(
1,
total/18
)

});

}else{

html+=
"<div class='news warn'>"+
"実現性に課題があります。修正が必要です。"+
"</div>";

}


document.getElementById("policyResult")
.innerHTML=html;

document.getElementById("policyInput")
.value="";

renderPolicies();

}


/* =====================================================
POLICY PROCESS
===================================================== */

function processPolicies(){

game.activePolicies.forEach(policy=>{

policy.delay--;

if(policy.delay<=0){

if(game.governing){

game.support+=policy.impact;

addNews(
"政策「"+
policy.text.substring(0,30)+
"」の効果が現れ始めました。",
"good"
);

}else{

game.support+=
policy.impact*0.15;

}

}

});


game.activePolicies=
game.activePolicies.filter(
policy=>policy.delay>0
);

}


/* =====================================================
ELECTION
===================================================== */

function checkElection(){

if(
game.year>=game.electionYear &&
game.month===7
){

startElectionPromise();

}

}


/* =====================================================
ELECTION PROMISE
===================================================== */

function startElectionPromise(){

if(game.lastElectionPromise)return;

game.lastElectionPromise=true;

game.promises=[];

addNews(
"選挙が近づいています。今回の選挙公約を発表する必要があります。",
"warn"
);

const promise=
prompt(
"今回の選挙公約を入力してください。"
);

if(promise){

game.promises.push({

text:promise,

done:false,

months:0

});

game.support+=2;

addNews(
"選挙公約を発表しました。支持率が上昇しました。",
"good"
);

}else{

game.support-=3;

addNews(
"選挙公約を発表しませんでした。支持率が低下しました。",
"bad"
);

}

holdElection();

}


/* =====================================================
PROMISE PROCESS
===================================================== */

function processPromises(){

game.promises.forEach(p=>{

if(!p.done){

p.months++;

if(p.months===6){

game.support-=2;

addNews(
"選挙公約の実行が進んでいません。支持率が低下しました。",
"bad"
);

}

}

});

}


/* =====================================================
ELECTION
===================================================== */

function holdElection(){

const results=[];

Object.keys(parties).forEach(name=>{

const party=parties[name];

let support=
name===game.party
?game.support
:party.support;


if(name===game.party){

if(game.governing){

support+=
(game.economy-50)*0.08;

support-=
(game.prices-50)*0.05;

}else{

if(game.economy<45){

support+=1;

}

}

}


const seats=
Math.max(
0,
Math.round(
support*4+
(Math.random()*12-6)
)
);

results.push({

party:name,

seats:seats

});

});


let total=
results.reduce(
(sum,item)=>sum+item.seats,
0
);


if(total>465){

const scale=
465/total;

results.forEach(item=>{

item.seats=
Math.floor(item.seats*scale);

});

}


const player=
results.find(
item=>item.party===game.party
);

game.seats=
player?player.seats:0;


const winner=
results
.slice()
.sort(
(a,b)=>b.seats-a.seats
)[0];


if(
winner.party===game.party &&
game.seats>=233
){

game.governing=true;

addNews(
"選挙で勝利し、与党になりました。",
"good"
);

}else{

game.governing=false;

game.primeMinister=false;

addNews(
"選挙が終了しました。最大勢力は"+
winner.party+
"です。"
);

}


game.electionHistory.push({

year:game.year,

winner:winner.party,

playerSeats:game.seats

});


game.electionYear+=4;

game.lastElectionPromise=false;

}

YEARLY UPDATE

function yearlyUpdate(){

game.playerAge++;

politicians.forEach(p=>{

if(p.retired)return;

p.age++;

});


politicians.forEach(p=>{

if(
p.age>=75 &&
!p.retired
){

const chance=
0.15+
(p.age-75)*0.07;

if(Math.random()<chance){

p.retired=true;

addNews(
p.name+
"が政界引退を表明しました。"
);

}

}

});


generateYoungPolitician();

}

/* =====================================================
LEADERSHIP
===================================================== */

function startLeadershipElection(){

if(!game.governing){

alert(
"現在は野党なので総裁選を行えません。"
);

return;

}


const candidates=
politicians.filter(p=>
p.party===game.party &&
!p.retired
);


if(candidates.length===0){

alert("候補者がいません。");

return;

}


const best=
candidates
.slice()
.sort(
(a,b)=>
(b.base+b.ambition+b.popularity)-
(a.base+a.ambition+a.popularity)
)[0];


const chance=
clamp(
40+
best.base*0.2+
game.base*0.2+
game.support*0.1,
5,
95
);


if(Math.random()*100<chance){

game.primeMinister=true;

game.leader="あなた";

addNews(
"総裁選に勝利しました。あなたが党首になりました。",
"good"
);

}else{

game.leader=best.name;

game.primeMinister=false;

addNews(
"総裁選で敗北しました。"+
best.name+
"が党首になりました。",
"bad"
);

}


updateUI();

}
