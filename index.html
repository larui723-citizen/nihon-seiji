<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本政治SIM</title>
<style>
:root{
--bg:#07111f;
--panel:#0d1b2e;
--panel2:#12243b;
--line:#29425f;
--text:#eef5ff;
--muted:#9eb1c9;
--cyan:#28d7ff;
--blue:#4e8cff;
--green:#36d58a;
--yellow:#ffd166;
--red:#ff5c7a;
--purple:#b47cff;
--pink:#ff70c7;
--orange:#ff9f43;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{
border:1px solid #3b5877;
background:#162b45;
color:#fff;
border-radius:9px;
padding:9px 13px;
cursor:pointer;
transition:.12s;
}
button:hover{background:#203c5e;border-color:#5b80a8}
button:active{transform:translateY(2px) scale(.99)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{
width:100%;
background:#091727;
border:1px solid #35516e;
color:#fff;
border-radius:8px;
padding:10px;
}
textarea{min-height:80px;resize:vertical}
h1,h2,h3,p{margin-top:0}
.app{min-height:100vh}
.header{
position:sticky;
top:0;
z-index:20;
background:linear-gradient(120deg,#081426,#10294a 55%,#24143e);
border-bottom:1px solid #315073;
padding:14px 18px;
box-shadow:0 5px 25px #0008;
}
.header-top{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}
.logo{
font-size:22px;
font-weight:900;
letter-spacing:.04em;
}
.logo small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.status{
display:flex;
flex-wrap:wrap;
gap:7px;
justify-content:flex-end;
}
.badge{
display:inline-flex;
align-items:center;
gap:5px;
padding:5px 9px;
border-radius:99px;
background:#152941;
border:1px solid #34516f;
font-size:12px;
}
.badge.cyan{border-color:#238da8;color:#76eaff}
.badge.green{border-color:#267b5a;color:#70e5ae}
.badge.yellow{border-color:#92752c;color:#ffe092}
.badge.red{border-color:#8f3047;color:#ff9bb0}
.nav{
display:flex;
gap:6px;
overflow:auto;
padding-top:12px;
}
.nav button{
white-space:nowrap;
padding:8px 11px;
font-size:12px;
}
.nav button.active{
background:linear-gradient(135deg,#168fa8,#4656b8);
border-color:#65e6ff;
}
.main{
max-width:1500px;
margin:auto;
padding:18px;
}
.grid{
display:grid;
grid-template-columns:repeat(12,1fr);
gap:12px;
}
.col12{grid-column:span 12}
.col8{grid-column:span 8}
.col6{grid-column:span 6}
.col4{grid-column:span 4}
.col3{grid-column:span 3}
.card{
background:linear-gradient(145deg,#0d1b2e,#101f34);
border:1px solid var(--line);
border-radius:14px;
padding:15px;
box-shadow:0 7px 25px #0003;
}
.card.gradient{
background:linear-gradient(135deg,#102744,#171d3c 55%,#261b3e);
}
.card h2,.card h3{margin-bottom:10px}
.section-title{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin:5px 0 12px;
}
.section-title h2{margin:0;font-size:18px}
.kpis{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:9px;
}
.kpi{
padding:12px;
border-radius:11px;
background:#091727;
border:1px solid #243d59;
}
.kpi .label{font-size:11px;color:var(--muted)}
.kpi .value{font-size:22px;font-weight:900;margin-top:3px}
.kpi.cyan{border-top:3px solid var(--cyan)}
.kpi.green{border-top:3px solid var(--green)}
.kpi.yellow{border-top:3px solid var(--yellow)}
.kpi.purple{border-top:3px solid var(--purple)}
.list{display:flex;flex-direction:column;gap:8px}
.row{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:10px;
border:1px solid #253e5a;
border-radius:10px;
background:#0a1728;
}
.row.clickable{cursor:pointer}
.row.clickable:hover{border-color:#557ca5;background:#10223a}
.name{font-weight:800}
.muted{color:var(--muted);font-size:12px}
.small{font-size:12px}
.tiny{font-size:11px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.primary{background:linear-gradient(135deg,#147f99,#4052b0);border-color:#63dbf0}
.green-btn{background:#124c39;border-color:#2d9e72}
.red-btn{background:#551c2b;border-color:#a94660}
.yellow-btn{background:#544519;border-color:#9b8235}
.purple-btn{background:#3c245c;border-color:#7851a9}
.bar{
height:8px;
background:#07111d;
border-radius:99px;
overflow:hidden;
margin-top:6px;
}
.bar span{
display:block;
height:100%;
background:linear-gradient(90deg,var(--cyan),var(--purple));
}
.party{
border-left:4px solid var(--cyan);
}
.party.ldp{border-left-color:#e44}
.party.ishin{border-left-color:#ff9f43}
.party.center{border-left-color:#62a0ff}
.party.left{border-left-color:#66a6ff}
.party.green{border-left-color:#45d69a}
.person{
border-left:4px solid var(--purple);
}
.person:hover{border-left-color:var(--pink)}
.statline{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin-top:8px;
}
.stat{
background:#081523;
border:1px solid #203850;
border-radius:8px;
padding:7px;
text-align:center;
}
.stat b{display:block;font-size:15px}
.stat span{font-size:10px;color:var(--muted)}
.news{
border-left:4px solid var(--yellow);
}
.news.political{border-left-color:var(--pink)}
.news.personal{border-left-color:var(--cyan)}
.news.economic{border-left-color:var(--green)}
.map{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}
.district{
min-height:100px;
background:linear-gradient(145deg,#102844,#16223d);
border:1px solid #35587c;
border-radius:10px;
padding:10px;
cursor:pointer;
}
.district:hover{border-color:var(--cyan);transform:translateY(-1px)}
.district.selected{border:2px solid var(--yellow)}
.district .dn{font-weight:900;color:#8ceeff}
.election-layout{
display:grid;
grid-template-columns:1.3fr .7fr;
gap:12px;
}
.formgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}
.field label{
display:block;
font-size:11px;
color:var(--muted);
margin-bottom:5px;
}
.tabs2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs2 button.active{background:#354c9b;border-color:#7991ff}
.lock{
padding:18px;
border:1px dashed #49617d;
border-radius:12px;
color:var(--muted);
text-align:center;
}
.modal{
position:fixed;
inset:0;
z-index:50;
background:#000b;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}
.modal.hidden{display:none}
.modal-box{
width:min(850px,100%);
max-height:90vh;
overflow:auto;
background:linear-gradient(145deg,#0d1b2e,#14263f);
border:1px solid #456687;
border-radius:16px;
box-shadow:0 20px 70px #000b;
padding:18px;
}
.modal-head{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
border-bottom:1px solid #29435e;
padding-bottom:10px;
margin-bottom:12px;
}
.toast{
position:fixed;
right:18px;
bottom:18px;
z-index:100;
max-width:380px;
padding:12px 15px;
background:#142941;
border:1px solid #5d86ad;
border-radius:10px;
box-shadow:0 10px 30px #0008;
transform:translateY(120px);
opacity:0;
transition:.2s;
}
.toast.show{transform:translateY(0);opacity:1}
.start{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(circle at 20% 20%,#17476c 0,transparent 35%),
radial-gradient(circle at 80% 80%,#3c174d 0,transparent 35%),
#07111f;
}
.start-box{
width:min(1050px,100%);
background:#0b192b;
border:1px solid #3a5877;
border-radius:20px;
padding:25px;
box-shadow:0 20px 80px #0008;
}
.start-title{font-size:34px;font-weight:1000}
.start-sub{color:var(--muted);margin-bottom:20px}
.party-select-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:10px;
}
.party-option{
text-align:left;
min-height:78px;
}
.party-option.selected{
border:2px solid var(--cyan);
background:#153450;
}
.climate{
padding:12px;
border-radius:11px;
margin-bottom:12px;
}
.climate.left{background:linear-gradient(90deg,#0b3b70,#13263b)}
.climate.center{background:linear-gradient(90deg,#283342,#182433)}
.climate.right{background:linear-gradient(90deg,#582029,#2a1828)}
hr{border:0;border-top:1px solid #29415c;margin:15px 0}
@media(max-width:900px){
.col8,.col6,.col4,.col3{grid-column:span 12}
.kpis{grid-template-columns:repeat(2,1fr)}
.election-layout{grid-template-columns:1fr}
.party-select-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
.main{padding:10px}
.kpis{grid-template-columns:1fr 1fr}
.statline{grid-template-columns:1fr 1fr}
.map{grid-template-columns:1fr 1fr}
.formgrid{grid-template-columns:1fr}
.party-select-grid{grid-template-columns:1fr}
.header{padding:10px}
}
</style>
</head>

}

function buildPoliticians(){
 const arr=REAL_POLITICIANS.map(x=>({
  id:x[0],
  name:x[1],
  partyId:x[2],
  age:x[3],
  house:x[4],

  active:true,
  incumbent:true,
  foreign:[],

  localSupport:rint(20,70)
 }));

 const TARGET_POLITICIANS=800;

 const partyWeights={
 ldp:30,
 ishin:11,
 cra:12,
 dpfp:10,
 sanseito:8,
 mirai:7,
 jcp:6,
 reiwa:5,
 sdp:4,
 hoshu:3
};

const weightedParties=[];

PARTIES.forEach(p=>{
 const weight=partyWeights[p.id]||1;

 for(let i=0;i<weight;i++){
  weightedParties.push(p);
 }
});

while(arr.length<TARGET_POLITICIANS){
 const i=arr.length+1;
 const ps=weightedParties[rint(0,weightedParties.length-1)];

 arr.push({
  id:"ai_"+String(i).padStart(4,"0"),
  name:"政治家"+String(i),
  partyId:ps.id,
  age:rint(25,72),
 house:ps.houses?.[0]||"衆院",
group:[
 "無派閥・中堅",
 "政策グループ",
 "党内保守派",
 "党内改革派",
 "若手グループ"
][rint(0,4)],
  human:rint(55,84),
  popularity:rint(25,75),
  execution:rint(50,86),
  ambition:rint(40,90),
  trust:rint(50,90),
  media:rint(35,88),

active:true,
  incumbent:false,
  foreign:[],
familiarity:0,
relation:0,
localSupport:rint(20,70)
 });
}
 return arr;
}

function defaultState(){
const climate=rand(-.22,.22);
const politicians=buildPoliticians();
const parties={};

PARTIES.forEach(p=>{
 parties[p.id]={

   history:[]
  }
 };
});

const lowerTotal=465;
const upperTotal=248;

// 初期政党勢力。
// 現実の勢力差をベースにしつつ、ゲーム開始ごとに変動させる。
const initialPartyStrength={
 ldp:30,
 ishin:11,
 cra:12,
 dpfp:10,
 sanseito:8,
 mirai:7,
 jcp:6,
 reiwa:5,
 sdp:4,
 hoshu:3
};

function createInitialPartyScores(){
 const scores={};

 PARTIES.forEach(p=>{
  const base=initialPartyStrength[p.id]||1;

  // ゲーム開始時の世論・政治環境による変動
  const climateEffect=
   Math.exp(-Math.pow(p.ideology-climate,2)*3);

  const randomEffect=rand(.82,1.18);

  scores[p.id]=Math.max(
   0.5,
   base*(0.75+climateEffect*0.5)*randomEffect
  );
 });

 return scores;
}

function allocateInitialSeats(total,scores,house){
 const eligible=PARTIES.filter(p=>
  p.houses?.includes(house)
 );

 const list=eligible.map(p=>({
  id:p.id,
  raw:scores[p.id]
 }));

 const scoreTotal=list.reduce(
  (sum,p)=>sum+p.raw,
  0
 );

 list.forEach(p=>{
  p.exact=p.raw/scoreTotal*total;
  p.seats=Math.floor(p.exact);
  p.remainder=p.exact-p.seats;
 });

 let assigned=list.reduce(
  (sum,p)=>sum+p.seats,
  0
 );

 list
  .sort((a,b)=>b.remainder-a.remainder)
  .forEach(p=>{
   if(assigned<total){
    p.seats++;
    assigned++;
   }
  });

 return list;
}

const initialPartyScores=createInitialPartyScores();

const initialLowerSeats=
 allocateInitialSeats(
  lowerTotal,
  initialPartyScores,
  "衆院"
 );
const initialUpperSeats=
 allocateInitialSeats(
  upperTotal,
  Object.fromEntries(
   PARTIES.map(p=>[
    p.id,
    initialPartyScores[p.id]*
    rand(.90,1.10)
   ])
  ),
  "参院"
 );

initialLowerSeats.forEach(x=>{
 parties[x.id].lowerSeats=x.seats;
});

initialUpperSeats.forEach(x=>{
 parties[x.id].upperSeats=x.seats;
});
// 現在設定されている政党議席を基準に比例配分する
function allocateSeats(total,house){
 const eligible=PARTIES.filter(p=>
  p.houses?.includes(house)
 );

 const partyList=eligible.map(p=>({
  id:p.id,
  base:house==="衆院"
   ? parties[p.id].lowerSeats
   : parties[p.id].upperSeats
  }));

 const baseTotal=partyList.reduce((sum,p)=>sum+p.base,0);

 partyList.forEach(p=>{
  p.raw=baseTotal>0
   ? p.base/baseTotal*total
   : total/PARTIES.length;
  p.seats=Math.floor(p.raw);
  p.remainder=p.raw-p.seats;
 });

 let assigned=partyList.reduce((sum,p)=>sum+p.seats,0);

 partyList
  .sort((a,b)=>b.remainder-a.remainder)
  .forEach(p=>{
   if(assigned<total){
    p.seats++;
    assigned++;
   }
  });

 partyList.forEach(p=>{
  if(house==="衆院"){
   parties[p.id].lowerSeats=p.seats;
  }else{
   parties[p.id].upperSeats=p.seats;
  }
 });
}

allocateSeats(lowerTotal,"衆院");
allocateSeats(upperTotal,"参院");

// まず全員を現職ではない政治家として初期化
politicians.forEach(p=>{
 p.incumbent=false;
});

// 衆院465人を政党別議席数に合わせて選出
PARTIES.forEach(p=>{
 const candidates=politicians
  .filter(x=>x.partyId===p.id)
  .sort((a,b)=>(
   (b.popularity+b.execution+b.human)
   -
   (a.popularity+a.execution+a.human)
  ));

 const lowerCount=parties[p.id].lowerSeats;
 const upperCount=parties[p.id].upperSeats;

 candidates.slice(0,lowerCount).forEach(x=>{
  x.house="衆院";
  x.incumbent=true;
 });

 const remaining=candidates
  .filter(x=>!x.incumbent);

 remaining.slice(0,upperCount).forEach(x=>{
  x.house="参院";
  x.incumbent=true;
 });
});

politicians.forEach(p=>{
 parties[p.partyId].members.push(p.id);
});

PARTIES.forEach(p=>{
 const partyPoliticians=
  politicians.filter(x=>
   x.partyId===p.id &&
   x.active
  );

 const leader=
  partyPoliticians
   .slice()
   .sort((a,b)=>{
    const scoreA=
     Number(a.popularity||0)+
     Number(a.human||0)+
     Number(a.ambition||0);

    const scoreB=
     Number(b.popularity||0)+
     Number(b.human||0)+
     Number(b.ambition||0);

    return scoreB-scoreA;
   })[0];

 parties[p.id].leaderId=
  leader?.id||null;

 if(leader){
  leader.internalTitle="党首";
 }
});

const raw={};
let total=0;
PARTIES.forEach(p=>{
const dist=Math.abs(p.ideology-climate);
let s=2+Math.exp(-dist*dist*3)*25;
s+=p.lowerSeats/18;
s+=rand(-2.5,2.5);
raw[p.id]=Math.max(0.3,s);
total+=raw[p.id];
});

PARTIES.forEach(p=>{
parties[p.id].support=raw[p.id]/total*100;
parties[p.id].published=parties[p.id].support;
});

const partyMembers={};
PARTIES.forEach(p=>{
 partyMembers[p.id]=[];
 for(let i=0;i<5;i++){
  partyMembers[p.id].push({
   id:"m_"+p.id+"_"+i,
   name:p.short+" 党員"+(i+1),
   partyId:p.id,
   age:rint(25,58),
   recognition:rint(10,30),
   support:rint(5,20),
   role:"一般党員",
   loyalty:rint(55,90)
  });
 }
});

// 政党間の政治関係
const partyRelations={};

PARTIES.forEach(a=>{
 partyRelations[a.id]={};

 PARTIES.forEach(b=>{
  if(a.id===b.id){
   partyRelations[a.id][b.id]={
    politicalDistance:0,
    coalitionAffinity:100,
    cooperation:100,
    conflict:0
   };
   return;
  }

  const pledgeKeys=Object.keys(a.pledges||{});
  let pledgeDistance=0;

  pledgeKeys.forEach(key=>{
   const av=Number(a.pledges?.[key]??50);
   const bv=Number(b.pledges?.[key]??50);
   pledgeDistance+=Math.abs(av-bv);
  });

  pledgeDistance=
   pledgeKeys.length
    ? pledgeDistance/pledgeKeys.length
    : 50;

  const ideologyDistance=
   Math.abs(
    Number(a.ideology||0)-
    Number(b.ideology||0)
   )*50;

  const politicalDistance=clamp(
   pledgeDistance*.7+
   ideologyDistance*.3,
   0,
   100
  );

  partyRelations[a.id][b.id]={
   politicalDistance,
   coalitionAffinity:100-politicalDistance,
   cooperation:100-politicalDistance,
   conflict:politicalDistance
  };

function getCoalitionScore(partyAId,partyBId){
 const relation=
  state.partyRelations?.[partyAId]?.[partyBId];

 if(!relation)return 0;

 return clamp(
  relation.coalitionAffinity*.5+
  relation.cooperation*.3+
  (100-relation.conflict)*.2,
  0,
  100
 );
}

},

 parties,
 politicians,
 partyMembers,
 governmentParties:(()=>{
 const majority=Math.floor(lowerTotal/2)+1;

 const ranking=PARTIES
  .map(p=>({
   id:p.id,
   seats:parties[p.id].lowerSeats
  }))
  .sort((a,b)=>b.seats-a.seats);

 if(!ranking.length){
  return [];
 }

 const lead=ranking[0];

 // 単独過半数なら単独政権
 if(lead.seats>=majority){
  return [lead.id];
 }

 // 現段階では最大政党を中心とする連立を仮設定する。
 // 次の段階で党間政治距離・政策距離・連立関係を導入する。
 const coalition=[lead];
let totalSeats=lead.seats;

const partners=ranking
 .slice(1)
 .map(partner=>{
  const relation=
   partyRelations?.[lead.id]?.[partner.id];

  const coalitionScore=relation
   ? clamp(
      relation.coalitionAffinity*.5+
      relation.cooperation*.3+
      (100-relation.conflict)*.2,
      0,
      100
     )
   : 0;

  return {
   ...partner,
   coalitionScore
  };
 })
 .filter(partner=>partner.coalitionScore>=55)
 .sort((a,b)=>(
  b.coalitionScore-a.coalitionScore
 ));

for(const partner of partners){
 if(totalSeats>=majority)break;

 coalition.push(partner);
 totalSeats+=partner.seats;
}

 // 過半数に届かなくても少数与党として政権を成立させる
 return coalition.length
  ? coalition.map(x=>x.id)
  : [lead.id];
})(),

function makeBill(seed){

["社会保障改革法案","社会保障","社会保障制度の持続可能性を高める。",.1]

const x=bills[(seed-1)%bills.length];
return {title:x[0],category:x[1],text:x[2],ideology:x[3],support:0,oppose:0,abstain:0};
}

function renderPeople(){

  list=list.filter(p=>p.partyId===tab);

 tab!=="all"
  ? (state.partyMembers?.[tab]||[])

function partyVotePosition(p){
const d=Math.abs(p.ideology-state.bill.ideology);
if(d<.42)return "賛成";
if(d>.9)return "反対";
return Math.random()>.45?"賛成":"反対";
}

function getPartyCandidates(){
const pp=getPlayerParty();
const ps=state.politicians.filter(p=>p.partyId===pp.id && p.active);
const ordinary=state.partyMembers[pp.id]||[];
return ps.concat(ordinary.map(m=>({
id:m.id,name:m.name,house:"党員",popularity:m.support,execution:50,
human:50,ambition:60,trust:m.loyalty,media:m.recognition
})));
}
function getPerson(id){
 if(id==="player"){
  return state.player||null;
 }

 const politician=getPolitician(id);
 if(politician){
  return politician;
 }

 const member=findPartyMember(id);
 if(member){
  const pp=party(member.partyId);

  return {
   ...member,
   house:member.house||"党員",
   human:member.human??50,
   execution:member.execution??50,
   ambition:member.ambition??60,
   trust:member.trust??member.loyalty??50,
   popularity:member.popularity??member.support??0,
   media:member.media??member.recognition??0,
   ideology:
    member.ideology??
    (pp ? Math.round(Number(pp.ideology||0)*100) : 0),
   localSupport:member.localSupport??member.support??0,
   active:member.active!==false
  };
 }

 return null;
}

function getCandidatePerson(id){
 return getPerson(id);
}

function findPartyMember(id){
 for(const arr of Object.values(state.partyMembers||{})){
  const member=arr.find(x=>x.id===id);
  if(member)return member;
 }

 return null;
}

function candidateName(id){
 const p=getPerson(id);
 return p?.name||id;
}
function candidateName(id){
const p=getPolitician(id);
if(p)return p.name;
for(const arr of Object.values(state.partyMembers||{})){
const m=arr.find(x=>x.id===id);
if(m)return m.name;
}
return id;
}

  function drawGDPChart(){
  const canvas=document.getElementById("gdpChart");
  if(!canvas)return;


    const rect=canvas.getBoundingClientRect();
canvas.width=Math.round(rect.width);
canvas.height=Math.round(rect.height);

const ctx=canvas.getContext("2d");
  const history=Array.isArray(state.economyHistory)
    ? [...state.economyHistory].reverse()
    : [];

  if(history.length<2)return;

  const values=history.map(x=>Number(x.gdp)||0);

    const w=canvas.width;
const h=canvas.height;
  const pad=45;

  const min=Math.min(...values);
  const max=Math.max(...values);
  const range=(max-min)||1;

  ctx.clearRect(0,0,w,h);

  // 背景
  ctx.fillStyle="#091727";
  ctx.fillRect(0,0,w,h);

  // 横軸・縦軸
  ctx.strokeStyle="#9eb1c9";
  ctx.lineWidth=1;

  ctx.beginPath();
  ctx.moveTo(pad,20);
  ctx.lineTo(pad,h-pad);
  ctx.lineTo(w-20,h-pad);
  ctx.stroke();

  // GDPの線
  ctx.beginPath();

  values.forEach((value,i)=>{
    const x=pad+(i/(values.length-1))*(w-pad-20);
    const y=h-pad-((value-min)/range)*(h-pad-40);

    if(i===0){
      ctx.moveTo(x,y);
    }else{
      ctx.lineTo(x,y);
    }
  });

 for(let i=1;i<values.length;i++){
  const x1=pad+((i-1)/(values.length-1))*(w-pad-20);
  const y1=h-pad-((values[i-1]-min)/range)*(h-pad-40);

  const x2=pad+(i/(values.length-1))*(w-pad-20);
  const y2=h-pad-((values[i]-min)/range)*(h-pad-40);

  if(values[i]>values[i-1]){
    ctx.strokeStyle="#36d58a";
  }else if(values[i]<values[i-1]){
    ctx.strokeStyle="#ff4d4d";
  }else{
    ctx.strokeStyle="#111111";
  }

  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

  // GDPの数値
  ctx.fillStyle="#eef5ff";
  ctx.font="12px sans-serif";

  values.forEach((value,i)=>{
    const x=pad+(i/(values.length-1))*(w-pad-20);
    const y=h-pad-((value-min)/range)*(h-pad-40);

    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fill();

    ctx.fillText(
      value.toFixed(1),
      x-15,
      y-10
    );
  });

  // 最小値・最大値
  ctx.fillStyle="#9eb1c9";
  ctx.font="11px sans-serif";

  ctx.fillText(max.toFixed(1),5,25);
  ctx.fillText(min.toFixed(1),5,h-pad);
      // 横軸の年月
  ctx.fillStyle="#9eb1c9";
  ctx.font="11px sans-serif";

  history.forEach((item,i)=>{
    if(i % Math.max(1,Math.floor(history.length/6)) !== 0) return;

    const x=pad+(i/(history.length-1))*(w-pad-20);

    ctx.fillText(
      item.year+"年"+item.month+"月",
      x-25,
      h-8
    );
  });
}

function updatePopulationStats(){
  const e=state.economy;

  if(typeof e.population!=="number")e.population=123.5;
  if(typeof e.birthRate!=="number")e.birthRate=1.20;
  if(typeof e.births!=="number")e.births=680000;
  if(typeof e.deaths!=="number")e.deaths=1600000;
  if(typeof e.netMigration!=="number")e.netMigration=180000;
  if(typeof e.agingRate!=="number")e.agingRate=29.3;
  if(typeof e.workingAgePopulation!=="number")e.workingAgePopulation=73.0;

  // 基準値
  const basePopulation=123.5;
  const baseBirthRate=1.20;
  const baseBirths=680000;
  const baseDeaths=1600000;
  const baseAgingRate=29.3;
  const baseNetMigration=180000;
  const baseWorkingAgePopulation=73.0;

    // -------------------------
  // 合計特殊出生率（TFR）
  // -------------------------
  // 経済・雇用・住宅・所得から出生率の目標値を計算する

  let targetBirthRate=1.20;

  // 賃金
  targetBirthRate+=(e.wage-3.0)*0.08;

  // 失業率
  targetBirthRate-=(e.unemployment-2.5)*0.06;

  // 住宅価格
  targetBirthRate-=(e.housingPrice-100)*0.01;

  // 可処分所得
  targetBirthRate+=(e.disposableIncome-300)*0.01;

  // 政策・経済環境による目標値の範囲
  targetBirthRate=clamp(
    targetBirthRate,
    0.70,
    2.00
  );

  // TFRは一気に変化せず、目標値へ徐々に近づく
  e.birthRate=
    e.birthRate*0.98+
    targetBirthRate*0.02;

  e.birthRate=clamp(
    e.birthRate,
    0.70,
    2.00
  );
  // -------------------------
  // 出生数
  // -------------------------
  const targetAnnualBirths=
    baseBirths*
    (e.population/basePopulation)*
    (e.birthRate/baseBirthRate);

  e.births=
    e.births*0.98+
    targetAnnualBirths*0.02;

  // -------------------------
  // 死亡数
  // -------------------------
  const targetAnnualDeaths=
    baseDeaths*
    (e.population/basePopulation)*
    (e.agingRate/baseAgingRate);

  e.deaths=
    e.deaths*0.98+
    targetAnnualDeaths*0.02;

  // -------------------------
  // 純移入
  // -------------------------
  let migrationPressure=0;

  if(typeof e.wage==="number"){
    migrationPressure+=(e.wage-3.0)*0.08;
  }

  if(typeof e.unemployment==="number"){
    migrationPressure-=(e.unemployment-2.5)*0.10;
  }

  if(typeof e.gdpGrowth==="number"){
    migrationPressure+=(e.gdpGrowth-1.2)*0.05;
  }

  if(typeof e.usdjpy==="number"){
    migrationPressure-=(e.usdjpy-148)*0.003;
  }

  const targetNetMigration=
    baseNetMigration*(1+migrationPressure);

  e.netMigration=
    e.netMigration*0.98+
    targetNetMigration*0.02;

  e.netMigration=clamp(
    e.netMigration,
    -500000,
    500000
  );
   // -------------------------
  // 高齢化率
  // -------------------------
  // 出生率・死亡数・人口構造の変化によって
  // 高齢化率が長期的にゆっくり変化する

  const targetAgingRate=
    29.3
    +(1.20-e.birthRate)*1.2
    +(e.deaths/1000000-1.6)*0.8;

  e.agingRate=
    e.agingRate*0.99+
    targetAgingRate*0.01;

  e.agingRate=clamp(
    e.agingRate,
    20,
    40
  );
  // -------------------------
  // 生産年齢人口
  // -------------------------
  // 総人口と高齢化率から生産年齢人口の目標値を計算
  const targetWorkingAgeShare=
    (100-e.agingRate-11.6)/100;

  const targetWorkingAgePopulation=
    e.population*targetWorkingAgeShare;

  // 人口構造は急激には変化しない
 e.workingAgePopulation=
  e.workingAgePopulation*0.98+
  targetWorkingAgePopulation*0.02;

  // 基準値から大きく外れないようにする
  e.workingAgePopulation=clamp(
    e.workingAgePopulation,
    0,
    e.population
  );

  // -------------------------
  // 人口増減
  // -------------------------
  const annualChange=
    e.births-e.deaths+e.netMigration;

  const monthlyChange=
    annualChange/12/1000000;

  e.population+=monthlyChange;

  if(e.population<0)e.population=0;

  // 表示用に丸める
  e.birthRate=Number(e.birthRate.toFixed(3));
  e.births=Math.round(e.births);
  e.deaths=Math.round(e.deaths);
  e.netMigration=Math.round(e.netMigration);
  e.workingAgePopulation=Number(
    e.workingAgePopulation.toFixed(2)
  );
 e.population=Number(e.population.toFixed(3));
}

function updatePartyPledgePressure(){
 Object.values(state.parties).forEach(party=>{
  if(!party?.pledges)return;

  if(!party.pledgeDynamics){
   party.pledgeDynamics={
    pressure:0,
    lastChanged:null,
    lastReason:"ゲーム開始時の初期公約"
   };
  }

  const currentSupport=Number(party.support||0);
  const previousSupport=Number(
   party.pledgeDynamics.previousSupport??currentSupport
  );

  const supportChange=currentSupport-previousSupport;

  if(supportChange<0){
   party.pledgeDynamics.pressure=clamp(
    party.pledgeDynamics.pressure+Math.abs(supportChange)*2,
    0,
    100
   );
  }else if(supportChange>0){
   party.pledgeDynamics.pressure=clamp(
    party.pledgeDynamics.pressure-supportChange,
    0,
    100
   );
  }

  party.pledgeDynamics.previousSupport=currentSupport;
 });
}

function evolvePartyPledges(){
 const domainPressures=getPolicyDomainPressures();

 PARTIES.forEach(p=>{
  const party=state.parties[p.id];
  if(!party?.pledges)return;

  if(!party.pledgeDynamics){
   party.pledgeDynamics={
    pressure:0,
    lastChanged:null,
    lastReason:"ゲーム開始時の初期公約",
    history:[]
   };
  }

  if(!party.pledgeDynamics.history){
   party.pledgeDynamics.history=[];
  }

  if(party.pledgeDynamics.pressure<50)return;

  const candidates=Object.entries(domainPressures)
   .filter(([key,pressure])=>{
    return pressure>0 && party.pledges[key]!==undefined;
   });

  if(!candidates.length)return;

  candidates.sort((a,b)=>b[1]-a[1]);

  const maxPressure=candidates[0][1];

  const topCandidates=candidates.filter(
   ([key,pressure])=>pressure===maxPressure
  );

  const [key]=topCandidates[
   Math.floor(Math.random()*topCandidates.length)
  ];

  const oldValue=Number(party.pledges[key]??50);

  const targetValue=getPartyPolicyTarget(party,key);

let direction=0;

if(oldValue<targetValue){
 direction=1;
}else if(oldValue>targetValue){
 direction=-1;
}else{
 direction=0;
}

  const change=5+Math.floor(Math.random()*6);

const distance=Math.abs(targetValue-oldValue);

if(distance<5){
 return;
}

  const newValue=clamp(
   oldValue+(direction*change),
   0,
   100
  );

  if(newValue===oldValue)return;

  party.pledges[key]=newValue;

  party.pledgeTexts[key]=generatePledgeText(
   key,
   newValue,
   party.pledgeTexts?.[key]||""
  );

  party.pledgeDynamics.history.push({
   date:state.date,
   policy:key,
   oldValue:oldValue,
   newValue:newValue,
   reason:"社会・経済状況の変化と支持率低下を受け、党内で政策の見直しが行われた。"
  });

  party.pledgeDynamics.pressure=0;
  party.pledgeDynamics.lastChanged=state.date;
  party.pledgeDynamics.lastReason=
   "社会・経済状況の変化と支持率低下を受け、党内で政策の見直しが行われた。";
 });
}
function getPoliticalPressures(){
 const e=state.economy;

 return {
  inflation:typeof e.cpi==="number" && e.cpi>=2.5,
  recession:typeof e.gdpGrowth==="number" && e.gdpGrowth<=0,
  unemployment:typeof e.unemployment==="number" && e.unemployment>=4.0,
  wageGrowth:typeof e.wage==="number" && e.wage>=4.0,
  aging:typeof e.agingRate==="number" && e.agingRate>=30,
  birthDecline:typeof e.birthRate==="number" && e.birthRate<=1.10,
  yenWeakness:typeof e.usdjpy==="number" && e.usdjpy>=155,
  energyCost:typeof e.gasoline==="number" && e.gasoline>=190,
  crime:typeof e.crime==="number" && e.crime>=115,
  foreignSecurity:typeof e.foreignCases==="number" && e.foreignCases>=750
 };
}

function getPolicyDomainPressures(){
 const p=getPoliticalPressures();

 return {
  economy:(
   (p.inflation?2:0)+
   (p.recession?3:0)+
   (p.unemployment?2:0)+
   (p.wageGrowth?1:0)+
   (p.yenWeakness?2:0)+
   (p.energyCost?1:0)
  ),

  taxation:(
   (p.inflation?2:0)+
   (p.recession?2:0)+
   (p.yenWeakness?1:0)
  ),

  welfare:(
   (p.unemployment?1:0)+
   (p.aging?3:0)
  ),

  education:(
   (p.birthDecline?2:0)+
   (p.aging?1:0)
  ),

  childcare:(
   (p.birthDecline?4:0)+
   (p.wageGrowth?1:0)
  ),

  diplomacy:(
   (p.yenWeakness?1:0)+
   (p.foreignSecurity?3:0)
  ),

  defense:(
   (p.foreignSecurity?4:0)+
   (p.crime?1:0)
  ),

  energy:(
   (p.energyCost?4:0)+
   (p.yenWeakness?2:0)+
   (p.inflation?1:0)
  ),

  environment:(
   0
  ),

  constitutionalReform:(
   (p.foreignSecurity?1:0)+
   (p.crime?1:0)
  )
 };

}
function updateDietSession(){
 const month=state.date.month;

 // 特別会・緊急集会など、条件によって発生する国会は
 // 今後ここより優先して処理する。
 if(
  state.dietSession?.type==="特別会" ||
  state.dietSession?.type==="緊急集会"
 ){
  return;
 }

 let type="閉会中";
 let status="closed";

 if(month>=1 && month<=6){
  type="常会";
  status="open";
 }else if(month>=10 && month<=12){
  type="臨時会";
  status="open";
 }

 const previousType=state.dietSession?.type;

 state.dietSession.status=status;
 state.dietSession.type=type;

 if(status==="open"){
  if(
   previousType!=="常会" &&
   previousType!=="臨時会"
  ){
   state.dietSession.sessionNumber++;
   state.dietSession.startDate={
    year:state.date.year,
    month:state.date.month
   };
   state.dietSession.extensionCount=0;
   state.dietSession.maxExtensions=
    type==="常会"?1:2;
   state.dietSession.extendedEndDate=null;
   log(
    type==="常会"
     ? "通常国会が召集された。"
     : "臨時国会が召集された。"
   );
  }
 }else{
  if(previousType!=="閉会中"){
   state.dietSession.endDate={
    year:state.date.year,
    month:state.date.month
   };
   log("国会が閉会した。");
  }
 }
}

function voteBill(vote){
  if(state.player.house!=="衆院" && state.player.house!=="参院"){
    showToast("国会議員ではありません。");
    return;
  }

  state.bill.playerVote=vote;

  log(
    "あなたは法案に"+
    (vote==="support"?"賛成":
     vote==="oppose"?"反対":"棄権")+
    "した。"
  );

  showToast("あなたの投票を記録しました。");
  render();
}

function resolveBill(){
  const bill=state.bill;

  let support=0;
  let oppose=0;
  let abstain=0;

  // 各党の議席をもとに投票
  PARTIES.forEach(p=>{
    const x=state.parties[p.id];

    const seats=
      state.player.house==="参院"
        ? x.upperSeats
        : x.lowerSeats;

    const pos=partyVotePosition(p);

    if(pos==="賛成"){
      support+=seats;
    }else if(pos==="反対"){
      oppose+=seats;
    }else{
      abstain+=seats;
    }
  });

  // プレイヤー本人の票
  if(state.bill.playerVote==="support"){
    support++;
  }else if(state.bill.playerVote==="oppose"){
    oppose++;
  }else if(state.bill.playerVote==="abstain"){
    abstain++;
  }

  const passed=support>oppose;

  addNews(
    "politics",
    passed?"法案が国会を通過":"法案が国会で否決",
    "ゲーム内シナリオ。"+
    bill.title+
    "は"+
    (passed?"可決":"否決")+
    "された。"
  );

  log(
    "法案「"+
    bill.title+
    "」を採決。"+
    "賛成"+support+
    "・反対"+oppose+
    "・棄権"+abstain+
    "。結果："+(passed?"可決":"否決")+"。"
  );
 state.lastBillResult={
  playerVote:state.bill.playerVote || "abstain",
  support:support,
  oppose:oppose,
  abstain:abstain,
  passed:passed,
  title:state.bill.title
};
const resultBox=document.getElementById("billResult");

if(resultBox){
  const voteText=
    state.lastBillResult.playerVote==="support"
      ?"賛成"
      :state.lastBillResult.playerVote==="oppose"
        ?"反対"
        :"棄権";

  resultBox.innerHTML=
    "<strong>前回の採決結果</strong><br>"+
    "あなたの投票："+voteText+"<br>"+
    "賛成："+state.lastBillResult.support+"票<br>"+
    "反対："+state.lastBillResult.oppose+"票<br>"+
    "棄権："+state.lastBillResult.abstain+"票<br>"+
    "結果："+(state.lastBillResult.passed?"可決":"否決");
}
state.bill=makeBill(rint(1,7));

  render();

  showToast(
    passed
      ?"法案は可決されました。"
      :"法案は否決されました。"
  );
}

 function rebuildPartyLeadership(partyId){
 const pp=state.parties?.[partyId];

 if(!pp)return;

 const candidates=
  state.politicians
   .filter(p=>
    p.active &&
    p.partyId===partyId
   )
   .sort((a,b)=>{
    const scoreA=
     Number(a.popularity||0)+
     Number(a.human||0)+
     Number(a.ambition||0);

    const scoreB=
     Number(b.popularity||0)+
     Number(b.human||0)+
     Number(b.ambition||0);

    return scoreB-scoreA;
   });

 if(!candidates.length){
  pp.leaderId=null;
  pp.officers={
   secretaryGeneral:null,
   policy:null,
   election:null,
   media:null
  };
  return;
 }

 const leader=candidates[0];

 pp.leaderId=leader.id;
 leader.internalTitle="党首";

 const officers=[
  "secretaryGeneral",
  "policy",
  "election",
  "media"
 ];

 pp.officers=pp.officers||{};

 officers.forEach(key=>{
  pp.officers[key]=null;
 });

 const used=new Set([leader.id]);

 officers.forEach(key=>{
  const candidate=
   candidates.find(p=>!used.has(p.id));

  if(!candidate)return;

  pp.officers[key]=candidate.id;
  used.add(candidate.id);

  candidate.partyOfficerRole=
   ({
    secretaryGeneral:"幹事長",
    policy:"政策責任者",
    election:"選挙責任者",
    media:"広報責任者"
   })[key];
 });
}

function saveOfficers(){

 if(!pp)return;

  secretaryGeneral:"幹事長",
  policy:"政策責任者",
  election:"選挙責任者",

 };

 });

 /*

 ordinary.forEach(member=>{

   member.role==="幹事長" ||
   member.role==="政策責任者" ||
   member.role==="選挙責任者" ||
   member.role==="広報責任者"
  ){
   member.role="一般党員";
  }
 });

 /*
  * 新しい役員を登録
  */
 Object.keys(officerRoles).forEach(k=>{
  const id=selected[k];

  pp.officers[k]=id||null;

  if(!id)return;

  const member=findPartyMember(id);

  if(member && member.partyId===pp.id){
   member.role=officerRoles[k];
  }

  const politician=getPolitician(id);

  if(politician && politician.partyId===pp.id){
   politician.partyOfficerRole=officerRoles[k];
  }
 });

 closeModal();

 log("党執行部を任命した。");
 render();

 showToast("党執行部を任命しました。");
}

function updateGDPStats(){
  const e=state.economy;

  if(typeof e.gdp!=="number") e.gdp=610;
  if(typeof e.nominalGDP!=="number") e.nominalGDP=610;
  if(typeof e.realGDP!=="number") e.realGDP=600;
  if(typeof e.gdpGrowth!=="number") e.gdpGrowth=1.2;
  if(typeof e.perCapitaGDP!=="number") e.perCapitaGDP=490;
  if(typeof e.gdpDeflator!=="number") e.gdpDeflator=101.7;
  if(typeof e.gni!=="number") e.gni=625;
  if(typeof e.perCapitaGNI!=="number") e.perCapitaGNI=500;
  if(typeof e.potentialGDP!=="number") e.potentialGDP=615;
  if(typeof e.gdpGap!=="number") e.gdpGap=-0.8;

  // 景気を決める基本要因
  let growth=0;

  if(e.nikkei>45000) growth+=0.15;
  if(e.nikkei<38000) growth-=0.15;

  if(e.cpi>4) growth-=0.15;
  if(e.cpi<1) growth-=0.05;

  if(e.unemployment<2.5) growth+=0.15;
  if(e.unemployment>3.5) growth-=0.20;

  if(e.wage>3) growth+=0.15;
  if(e.wage<1) growth-=0.10;

  if(e.rate>2) growth-=0.10;
  if(e.rate<0.5) growth+=0.05;

  if(e.usdjpy>160) growth-=0.10;
  if(e.usdjpy<130) growth-=0.05;

  growth+=(Math.random()-0.5)*0.30;

  e.gdpGrowth=clamp(
    e.gdpGrowth*0.65+growth,
    -5,
    6
  );

  e.realGDP*=1+e.gdpGrowth/100;
  e.realGDP=clamp(e.realGDP,400,800);

  const inflationEffect=(e.cpi-2)*0.12;
  e.gdpDeflator+=inflationEffect;
  e.gdpDeflator=clamp(e.gdpDeflator,85,125);

  e.nominalGDP=e.realGDP*(e.gdpDeflator/100);
  e.gdp=e.nominalGDP;

  e.potentialGDP*=1.0015;
  e.potentialGDP=clamp(e.potentialGDP,500,850);

  e.gdpGap=((e.realGDP-e.potentialGDP)/e.potentialGDP)*100;
  e.gdpGap=clamp(e.gdpGap,-10,10);

  const populationBase=125.0;
  e.perCapitaGDP=(e.realGDP/populationBase)*100;

  e.gni=e.nominalGDP*1.025;
  e.perCapitaGNI=(e.gni/populationBase)*100;

  e.gdp=Number(e.gdp.toFixed(1));
  e.nominalGDP=Number(e.nominalGDP.toFixed(1));
  e.realGDP=Number(e.realGDP.toFixed(1));
  e.gdpGrowth=Number(e.gdpGrowth.toFixed(2));
  e.perCapitaGDP=Number(e.perCapitaGDP.toFixed(1));
  e.gdpDeflator=Number(e.gdpDeflator.toFixed(2));
  e.gni=Number(e.gni.toFixed(1));
}
function recordEconomyHistory(){
  if(!Array.isArray(state.economyHistory)){
    state.economyHistory=[];
  }

  const e=state.economy;

  state.economyHistory.unshift({
    year:state.date.year,
    month:state.date.month,
    nikkei:e.nikkei,
    gdp:e.gdp,
    nominalGDP:e.nominalGDP,
    realGDP:e.realGDP,
    gdpGrowth:e.gdpGrowth,
    perCapitaGDP:e.perCapitaGDP,
    gdpDeflator:e.gdpDeflator,
    gni:e.gni,
    perCapitaGNI:e.perCapitaGNI,
    potentialGDP:e.potentialGDP,
    gdpGap:e.gdpGap
  });

  state.economyHistory=state.economyHistory.slice(0,120);
}

  Number(targetParty.ideology||0)*100;

 pledgeKeys.forEach(key=>{

  pledgeDifference+=Math.abs(a-b);

 });

 const averagePledgeDifference=
  pledgeCount
   ? pledgeDifference/pledgeCount
   : 50;

 function executeTransferToAnotherParty(targetId){
 const currentParty=getPlayerParty();
 const targetParty=state.parties?.[targetId];

 if(!currentParty || !state.player){
  showToast("現在の所属政党を確認できません。");
  return;
 }

 if(!targetParty){
  showToast("移籍先政党を確認できません。");
  return;
 }

 if(currentParty.id===targetParty.id){
  showToast("現在と同じ政党には移籍できません。");
  return;
 }

 const player=state.player;

 /* --------------------------------
    現在の政党からプレイヤーを外す
    -------------------------------- */

 currentParty.members=
  (currentParty.members||[])
   .filter(id=>id!=="player");

 /* --------------------------------
    プレイヤーの議席を現在の政党から外す
    -------------------------------- */

 if(player.house==="衆院"){
  currentParty.lowerSeats=
   Math.max(
    0,
    Number(currentParty.lowerSeats||0)-1
   );
 }

 if(player.house==="参院"){
  currentParty.upperSeats=
   Math.max(
    0,
    Number(currentParty.upperSeats||0)-1
   );
 }

 /* --------------------------------
    プレイヤーが旧党首だった場合
    新しい党首を選ぶ
    -------------------------------- */

 if(currentParty.leaderId==="player"){

  const replacement=
   state.politicians
    .filter(p=>
     p.partyId===currentParty.id &&
     p.id!=="player" &&
     p.active
    )
    .sort((a,b)=>
     ((b.popularity||0)+(b.ambition||0))-
     ((a.popularity||0)+(a.ambition||0))
    )[0];

  currentParty.leaderId=
   replacement?.id||null;

  if(replacement){
   replacement.internalTitle="党首";
  }
 }

 /* --------------------------------
    移籍先政党へプレイヤーを追加
    -------------------------------- */

 if(!Array.isArray(targetParty.members)){
  targetParty.members=[];
 }

 if(!targetParty.members.includes("player")){
  targetParty.members.push("player");
 }

 /* --------------------------------
    議席を移籍先へ移す
    -------------------------------- */

 if(player.house==="衆院"){
  targetParty.lowerSeats=
   Number(targetParty.lowerSeats||0)+1;
 }

 if(player.house==="参院"){
  targetParty.upperSeats=
   Number(targetParty.upperSeats||0)+1;
 }

 /* --------------------------------
    プレイヤー本人の所属政党を変更
    -------------------------------- */

 player.partyId=targetParty.id;

 /*
  * 移籍先では一般議員として加入する。
  * 党首にはならない。
  */
 player.internalTitle="議員";

 /* --------------------------------
    state.politicians側も同期
    -------------------------------- */

 const playerPolitician=
  state.politicians.find(
   p=>p.id==="player"
  );

 if(playerPolitician){
  playerPolitician.partyId=targetParty.id;
  playerPolitician.internalTitle="議員";
 }

 /* --------------------------------
    移籍記録
    -------------------------------- */

 log(
  currentParty.name+
  "を離党し、"+
  targetParty.name+
  "へ移籍した。"
 );

 addNews(
  "politics",
  "議員移籍",
  player.name+
  "が"+
  currentParty.name+
  "を離党し、"+
  targetParty.name+
  "へ移籍した。"
 );

 saveSilently();

 closeModal();

 render();

 showToast(
  targetParty.name+
  "への移籍が成立しました。"
 );
}

 function executePartyMerger(targetId, mergerLeader){

 const currentParty=getPlayerParty();
 const targetParty=party(targetId);

 if(!currentParty || !targetParty){
  showToast("合併対象の政党を確認できません。");
  return;
 }

 if(currentParty.id===targetParty.id){
  showToast("同じ政党とは合併できません。");
  return;
 }

 /*
  * 議席を統合
  */
 targetParty.lowerSeats=
  Number(targetParty.lowerSeats||0)+
  Number(currentParty.lowerSeats||0);

 targetParty.upperSeats=
  Number(targetParty.upperSeats||0)+
  Number(currentParty.upperSeats||0);

 /*
  * 所属議員を統合
  */
 const currentMembers=
  Array.isArray(currentParty.members)
   ? currentParty.members
   : [];

 const targetMembers=
  Array.isArray(targetParty.members)
   ? targetParty.members
   : [];

 targetParty.members=
  [...new Set([
   ...targetMembers,
   ...currentMembers
  ])];

 /*
  * 一般党員を統合
  */
 const currentOrdinary=
  state.partyMembers?.[currentParty.id]||[];

 const targetOrdinary=
  state.partyMembers?.[targetParty.id]||[];

 state.partyMembers[targetParty.id]=[
  ...targetOrdinary,
  ...currentOrdinary
 ].map(member=>({
  ...member,
  partyId:targetParty.id
 }));

 /*
  * 政治家データの所属政党を変更
  */
 state.politicians.forEach(p=>{
  if(p.partyId===currentParty.id){
   p.partyId=targetParty.id;

   if(p.id==="player"){
    p.internalTitle="議員";
   }
  }
 });

 /*
  * 一般党員の所属政党も更新
  */
 (state.partyMembers[targetParty.id]||[])
  .forEach(member=>{
   member.partyId=targetParty.id;
  });

 /*
  * プレイヤーの所属政党を変更
  */
 state.player.partyId=targetParty.id;
 state.player.internalTitle="議員";

 /*
 * 合併後の党首を確定
 *
 * mergerLeader:
 *   "player"    → プレイヤーが党首
 *   相手党首ID → 相手党首が党首
 */
/*
 * 合併後の党首を確定
 *
 * mergerLeader:
 * "player"     → プレイヤーが党首
 * 相手党首ID   → 相手党首が党首
 *
 * 合併条件によって決まった結果を
 * そのまま実データへ反映する。
 */
const finalLeader=
 mergerLeader||
 targetParty.leaderId||
 currentParty.leaderId||
 null;

targetParty.leaderId=finalLeader;
/*
 * 合併後の政治家データの役職を同期
 */
state.politicians.forEach(p=>{

 if(p.partyId===targetParty.id){

  if(p.id===finalLeader){
   p.internalTitle="党首";
  }else{
   p.internalTitle="議員";
  }

 }

});

/*
 * プレイヤー本人の役職も同期
 */
if(finalLeader==="player"){

 state.player.internalTitle="党首";

}else{

 state.player.internalTitle="議員";

}

/*
 * プレイヤーの政治家データも同期
 */
const playerPolitician=
 state.politicians.find(
  p=>p.id==="player"
 );

if(playerPolitician){

 playerPolitician.partyId=targetParty.id;

 playerPolitician.internalTitle=
  finalLeader==="player"
   ?"党首"
   :"議員";

}
 /*
  * 元政党を削除
  */
 delete state.parties[currentParty.id];

 delete state.partyMembers[currentParty.id];

 /*
 * 合併による支持率変動
 *
 * 単純合算ではなく、
 * 合併による混乱・離反を考慮して82%程度を維持する。
 */
const targetSupport=
 Number(targetParty.support||0);

const currentSupport=
 Number(currentParty.support||0);

const mergerShock=
 rand(-0.6,0.4);

targetParty.support=
 clamp(
  ((targetSupport+currentSupport)*0.82)+mergerShock,
  0.2,
  60
 );

targetParty.published=
 clamp(
  Number(targetParty.published||targetSupport),
  0.2,
  60
 );

log(
 "合併による政党支持率の再編が発生した。"+
 "合併後支持率："+fmt(targetParty.support)+"%"
);

/*
 * 合併後の公約は存続政党を基本とする
 */
state.selectedPledgeParty=
 targetParty.id;

 state.tab="party";

 log(
  currentParty.name+
  "と"+
  targetParty.name+
  "が合併した。"
 );

 addNews(
  "politics",
  "政党合併",
  currentParty.name+
  "と"+
  targetParty.name+
  "が合併し、"+
  targetParty.name+
  "に統合された。"
 );

 saveSilently();

 closeModal();

 render();

 showToast(
  targetParty.name+
  "への合併が成立しました。"
 );
}
 /*
 * =========================================================
 * 党内分裂
 * =========================================================
 */

function splitParty(){

 const currentParty=getPlayerParty();

 if(!currentParty || !state.player){
  showToast("現在の所属政党を確認できません。");
  return;
 }

 const politicalMembers=
  state.politicians.filter(p=>
   p.active &&
   p.partyId===currentParty.id &&
   p.id!=="player"
  );

 const ordinaryMembers=
  state.partyMembers?.[currentParty.id]||[];

 if(
  politicalMembers.length+
  ordinaryMembers.length<
  2
 ){
  showToast("党内分裂を起こすには十分な党員・議員が必要です。");
  return;
 }

 /*
  * 分裂候補を評価
  *
  * 関係が悪い
  * 思想が離れている
  * 忠誠度が低い
  * 野心が高い
  *
  * ほど分裂側に入りやすくする。
  */

 const candidates=[];

 politicalMembers.forEach(p=>{

  const ideologyDistance=
   Math.abs(
    Number(p.ideology||0)-
    Number(state.player.ideology||0)
   );

  const relationValue=
   Number(p.relation||0);

  const trustValue=
   Number(p.trust||50);

  const ambitionValue=
   Number(p.ambition||50);

  let splitScore=0;

  splitScore+=ideologyDistance*.25;

  splitScore+=
   Math.max(0,50-relationValue)*.35;

  splitScore+=
   Math.max(0,50-trustValue)*.20;

  splitScore+=
   Math.max(0,ambitionValue-50)*.20;

  splitScore+=rand(-8,8);

  splitScore=
   clamp(splitScore,0,100);

  if(splitScore>=45){
   candidates.push({
    type:"politician",
    id:p.id,
    name:p.name,
    score:splitScore
   });
  }
 });

 ordinaryMembers.forEach(m=>{

  const ideologyDistance=
   Math.abs(
    Number(m.ideology||0)-
    Number(state.player.ideology||0)
   );

  const loyaltyValue=
   Number(m.loyalty||50);

  let splitScore=0;

  splitScore+=ideologyDistance*.35;

  splitScore+=
   Math.max(0,60-loyaltyValue)*.65;

  splitScore+=rand(-8,8);

  splitScore=
   clamp(splitScore,0,100);

  if(splitScore>=45){
   candidates.push({
    type:"ordinary",
    id:m.id,
    name:m.name,
    score:splitScore
   });
  }
 });

 /*
  * 少なくとも1人は分裂側へ
  *
  * 候補がいなければ、
  * 最もプレイヤーとの関係が弱い人物を候補にする。
  */

 if(!candidates.length){

  const fallback=[
   ...politicalMembers.map(p=>({
    type:"politician",
    id:p.id,
    name:p.name,
    score:20
   })),
   ...ordinaryMembers.map(m=>({
    type:"ordinary",
    id:m.id,
    name:m.name,
    score:20
   }))
  ];

  fallback.sort((a,b)=>a.score-b.score);

  if(fallback.length){
   candidates.push(fallback[0]);
  }
 }

 candidates.sort((a,b)=>b.score-a.score);

 /*
  * 分裂側に入る人数を決定
  *
  * 最大でも党全体の半分程度。
  */
 const totalMembers=
  politicalMembers.length+
  ordinaryMembers.length;

 const maxSplit=
  Math.max(
   1,
   Math.floor(totalMembers/2)
  );

 const splitMembers=[
 {
  type:"politician",
  id:"player",
  name:state.player.name,
  score:100
 },
 ...candidates
  .sort((a,b)=>b.score-a.score)
  .slice(0,Math.max(0,maxSplit-1))
];

 const politicalSplit=
  splitMembers.filter(x=>x.type==="politician");

 const ordinarySplit=
  splitMembers.filter(x=>x.type==="ordinary");

 /*
  * 議席数を分裂側へ移す。
  *
  * 分裂議員本人の所属院に応じて
  * 議席を割り当てる。
  */
 let splitLower=0;
 let splitUpper=0;

 politicalSplit.forEach(x=>{

  const p=
   state.politicians.find(
    politician=>politician.id===x.id
   );

  if(!p)return;

  if(p.house==="衆院"){
   splitLower++;
  }

  if(p.house==="参院"){
   splitUpper++;
  }
 });

 /*
  * 分裂側には最低でも
  * 参加した議員・党員を入れる。
  */

 const splitCount=
  politicalSplit.length+
  ordinarySplit.length;

 if(splitCount<=0){
  showToast("今回は党内分裂に参加する者がいませんでした。");
  return;
 }

 const averageScore=
  Math.round(
   splitMembers.reduce(
    (sum,x)=>sum+x.score,
    0
   )/splitMembers.length
  );

 const names=
  [
   currentParty.name+"改革党",
   currentParty.name+"新党",
   currentParty.name+"再建党",
   currentParty.name+"刷新会",
   currentParty.name+"政策会"
  ];

 const existingNames=
  new Set(
   Object.values(state.parties||{})
    .map(p=>p.name)
  );

 let newPartyName=
  names.find(name=>
   !existingNames.has(name)
  );

 if(!newPartyName){

  let index=1;

  do{
   newPartyName=
    currentParty.name+
    "・新勢力"+index;
   index++;
  }while(existingNames.has(newPartyName));
 }

 openModal(
  "党内分裂の結果",
  `
  <div class="card">

   <h3>${esc(currentParty.name)}</h3>

   <div class="section-title">
    <b>分裂判定</b>
    <span class="badge ${
     averageScore>=65
      ?"red"
      :"yellow"
    }">
     ${averageScore}点
    </span>
   </div>

   <p>
    党内の関係値・思想差・忠誠度・野心などから、
    ${splitCount}人が分裂側に加わる可能性が高いと判定されました。
   </p>

   <div class="muted">
    分裂側の予定政党名：<b>${esc(newPartyName)}</b><br>
    衆院議席：${splitLower}<br>
    参院議席：${splitUpper}<br>
    分裂参加者：${splitCount}人
   </div>

   <div class="actions" style="margin-top:16px">

    <button
     type="button"
     class="red-btn"
     data-action="confirmPartySplit"
    >
     この分裂を実行する
    </button>

    <button
     type="button"
     data-action="closeModal"
    >
     中止する
    </button>

   </div>

  </div>
  `
 );

 /*
  * 実行用に一時保存
  */
 state.pendingPartySplit={
  currentPartyId:currentParty.id,
  newPartyName,
  splitMembers,
  splitLower,
  splitUpper,
  averageScore
 };
}

 if(!pending){

 if(!currentParty){

 pending.splitMembers

 */
pending.splitMembers
 .filter(x=>x.type==="politician")

  /*

  const p=

   );

  if(!p)return;

  p.partyId=newId;
  p.internalTitle="議員";

  state.parties[newId].members.push(p.id);
 });

   const p=
    state.politicians.find(
     politician=>politician.id===x.id
    );

   if(!p)return;

   p.partyId=newId;
   p.internalTitle="議員";

   state.parties[newId].members.push(p.id);

  });

 /*
  * 元政党から分裂参加者を削除
  */
 currentParty.members=
  (currentParty.members||[])
   .filter(id=>
    !pending.splitMembers.some(
     x=>x.id===id
    )
   );

 /*
  * 元政党の一般党員からも削除
  */
 state.partyMembers[currentParty.id]=
  (state.partyMembers[currentParty.id]||[])
   .filter(member=>
    !pending.splitMembers.some(
     x=>x.id===member.id
    )
   );

 /*
  * 議席を元党から減らす
  */
 currentParty.lowerSeats=
  Math.max(
   0,
   Number(currentParty.lowerSeats||0)-
   pending.splitLower
  );

 currentParty.upperSeats=
  Math.max(

  );

 /*

 const splitLeader=
 splitPoliticians.find(p=>p.id==="player")
 ||
 splitPoliticians
  .slice()

 if(splitLeader){

 }else{

 currentParty.support=

 function confirmLeaveAndFormNewParty(){
 const oldParty=getPlayerParty();

 if(!oldParty || !state.player){
  showToast("現在の所属政党を確認できません。");
  return;
 }

 const partyName=
  document.getElementById("leaveNewPartyName")?.value.trim()
  ||"日本改革党";

 const philosophy=
  document.getElementById("leaveNewPartyPhilosophy")?.value.trim()
  ||"改革";

 const ideology=
  Number(
   document.getElementById("leaveNewPartyIdeology")?.value||0
  );

 if(!partyName){
  showToast("新党名を入力してください。");
  return;
 }

 const newId="newparty_"+Date.now();

 const initialPledges=
  buildInitialPartyPledges(
   philosophy,
   ideology
  );

 /*
  * プレイヤー自身の議席だけを新党へ移す。
  * 複数議員が同行する仕組みは次の⑥後半で実装する。
  */
 const transferredLower=
  state.player.house==="衆院"
   ? Math.min(1,Number(oldParty.lowerSeats||0))
   : 0;

 const transferredUpper=
  state.player.house==="参院"
   ? Math.min(1,Number(oldParty.upperSeats||0))
   : 0;

 /*
  * 元の党からプレイヤーを離脱させる
  */
 oldParty.members=
  (oldParty.members||[])
   .filter(id=>id!=="player");

 oldParty.lowerSeats=
  Math.max(
   0,
   Number(oldParty.lowerSeats||0)-transferredLower
  );

 oldParty.upperSeats=
  Math.max(
   0,
   Number(oldParty.upperSeats||0)-transferredUpper
  );

 /*
  * プレイヤーが元党の党首だった場合、
  * 元党には別の党首候補を立てる。
  */
 if(oldParty.leaderId==="player"){
 oldParty.leaderId=null;
}
 /*
  * 新党を作成
  */
 state.parties[newId]={
  id:newId,
  name:partyName,
  short:partyName.slice(0,5),

  ideology:ideology/100,

  support:1.2,
  published:1.2,

  color:"green",

  lowerSeats:transferredLower,
  upperSeats:transferredUpper,

  leaderId:"player",

  philosophy,

  pledges:initialPledges.pledges,
  pledgeTexts:initialPledges.pledgeTexts,

  pledgeDynamics:{
   pressure:0,
   lastChanged:null,
   lastReason:"離党・新党結成時の初期公約",
   previousSupport:1.2,
   history:[]
  },

  members:["player"],

  officers:{
   secretaryGeneral:null,
   policy:null,
   election:null,
   media:null
  }
 };

 /*
  * 新党の一般党員5人
  */
 state.partyMembers[newId]=[];

 const memberNames=
  generatePartyMemberNames(5);

 for(let i=0;i<5;i++){
  state.partyMembers[newId].push({
   id:"m_"+newId+"_"+i,
   name:memberNames[i],
   partyId:newId,
   age:rint(25,55),
   recognition:rint(8,18),
   support:rint(5,15),
   role:"一般党員",
   loyalty:rint(70,90),
   ideology:clamp(
    ideology+rint(-15,15),
    -80,
    80
   )
  });
 }

 /*
  * プレイヤーの所属政党を変更
  */
 state.player.partyId=newId;
 state.player.internalTitle="党首";

 /*
  * 既存政党から開始したプレイヤーは
  * state.politiciansにも存在するので、
  * その政治家データも新党へ移す。
  */
 const playerPolitician=
  state.politicians.find(
   p=>p.id==="player"
  );

 if(playerPolitician){
  playerPolitician.partyId=newId;
  playerPolitician.internalTitle="党首";
 }

 /*
  * 新党の党首任期を3年間設定
  */
 state.leadership.termStart={
  year:state.date.year,
  month:state.date.month
 };

 state.leadership.termEnd={
  year:state.date.year+3,
  month:state.date.month
 };

 state.leadership.scheduledElection={
  year:state.date.year+3,
  month:state.date.month
 };

 state.leadership.active=false;
 state.leadership.candidates=[];
 state.leadership.candidacyDecision=null;
 state.leadership.emergency=false;
 state.leadership.emergencyReason=null;

 /*
  * 新党の支持率計算用データ
  */
 state.parties[newId].support=1.2;
 state.parties[newId].published=1.2;

 state.selectedPledgeParty=newId;
 state.tab="party";

 closeModal();

 log(
  oldParty.name+
  "を離党し、新党「"+
  partyName+
  "」を結成した。"
 );

 if(transferredLower>0){
  log(
   "あなたの衆院議席1を新党へ移した。"
  );
 }

 if(transferredUpper>0){
  log(
   "あなたの参院議席1を新党へ移した。"
  );
 }

 addNews(
  "politics",
  "新党が結成された",
  oldParty.name+
  "を離党した"+
  state.player.name+
  "が新党「"+
  partyName+
  "」を結成した。"
 );

 saveSilently();
 render();

 showToast(
  "離党して「"+
  partyName+
  "」を結成しました。"
 );
}

/* =========================================================
クリック処理
ここが「ボタンを全部動かす」中心部分
========================================================= */

function handleClick(e){
const b=e.target.closest("button[data-action], .clickable[data-action]");
if(!b)return;
if(b.disabled)return;

const a=b.dataset.action;

try{
if(a==="tab"){
state.tab=b.dataset.tab;
render();
return;
}
if(a==="economyTab"){
state.economyTab=b.dataset.tab;
render();
return;
}
if(a==="chooseStartParty"){
document.querySelectorAll(".party-option").forEach(x=>x.classList.remove("selected"));
b.classList.add("selected");
const input=document.getElementById("startParty");
if(input)input.value=b.dataset.party;
return;
}

if(a==="startExisting"){startExisting();return}
if(a==="startNewParty"){startNewParty();return}
if(a==="restoreStart"){
if(loadState() && state.started){
render();
showToast("保存データを復元しました。");
}else showToast("有効な保存データがありません。");
return;
}
if(a==="deleteSave"){
localStorage.removeItem(STORAGE_KEY);
renderStart();
showToast("保存データを削除しました。");
return;
}

if(a==="personalAction"){
if(spendAction(b.dataset.kind)){
saveSilently();
render();
showToast("行動を実行しました。残り"+actionLeft()+"行動。");
}
return;
}

if(a==="setAuto"){
state.auto.direction=document.getElementById("autoDirection")?.value||"policy";
state.auto.enabled=true;
saveSilently();
showToast("自動行動方針を設定しました。");
return;
}

if(a==="autoFill"){autoFill();return}
if(a==="nextMonth"){nextMonth();return}

if(a==="peopleTab"){
state.selectedPeopleTab=b.dataset.people;
render();
return;
}

if(a==="selectPledgeParty"){
state.selectedPledgeParty=b.dataset.party;
render();
return;
}

if(a==="person"){openPerson(b.dataset.id);return}
if(a==="member"){openMember(b.dataset.id);return}

if(a==="appointOfficers"){appointOfficers();return}
if(a==="saveOfficers"){saveOfficers();return}
 if(a==="leaveAndFormNewParty"){
 leaveAndFormNewParty();
 return;
}
 if(a==="confirmLeaveAndFormNewParty"){
 confirmLeaveAndFormNewParty();
 return;
}
 if(a==="transferToAnotherParty"){
 transferToAnotherParty();
 return;
}
 if(a==="confirmTransferToAnotherParty"){
 confirmTransferToAnotherParty();
 return;
}
 if(a==="mergeWithAnotherParty"){
 mergeWithAnotherParty();
 return;
}

if(a==="splitParty"){
 splitParty();
 return;
}

if(a==="confirmMergeWithAnotherParty"){
 evaluateMergeRequest();
 return;
}

if(a==="confirmPartySplit"){
 executePartySplit();
 return;
}
if(a==="executePartyMerger"){
 executePartyMerger(
  b.dataset.party,
  b.dataset.leader
 );
 return;
}
 if(a==="executeTransferToAnotherParty"){
 executeTransferToAnotherParty(b.dataset.party);
 return;
}
if(a==="promotePerson"){promotePerson(b.dataset.id);return}
if(a==="memberMeet"){memberMeet(b.dataset.id);return}
if(a==="memberPromote"){memberPromote(b.dataset.id);return}

if(a==="leadershipPrepare"){leadershipPrepare();return}
if(a==="decideLeadershipCandidacy"){
 decideLeadershipCandidacy(b.dataset.decision);
 return;
}
if(a==="leadershipVote"){leadershipVote(b.dataset.id);return}
if(a==="voteBill"){
voteBill(b.dataset.vote);
return;
}
if(a==="resolveBill"){resolveBill();return}

if(a==="electionTab"){
state.selectedElection=b.dataset.election;
render();
return;
}

if(a==="selectDistrict"){
state.election[state.selectedElection].selectedDistrict=Number(b.dataset.district);
render();
return;
}

if(a==="saveDistrict"){
saveDistrict(b.dataset.election,b.dataset.district);
return;
}

if(a==="prAdd"){prAdd(b.dataset.election);return}
if(a==="prUp"){prMove(b.dataset.election,b.dataset.index,-1);return}
if(a==="prDown"){prMove(b.dataset.election,b.dataset.index,1);return}
if(a==="prRemove"){prRemove(b.dataset.election,b.dataset.index);return}
if(a==="runElection"){runElection(b.dataset.election);return}

if(a==="foreignMeeting"){foreignMeeting(b.dataset.country);return}
if(a==="foreignAction"){foreignAction(b.dataset.country,b.dataset.kind);return}

if(a==="newsTab"){
state.selectedNews=b.dataset.news;
render();
return;
}
if(a==="newsDetail"){openNews(b.dataset.id);return}

if(a==="meetPerson"){meetPerson(b.dataset.id);return}
if(a==="introduce"){introduce(b.dataset.id);return}


if(a==="openTalk"){openTalk(b.dataset.party);return}
if(a==="talkResponse"){talkResponse(b.dataset.party,b.dataset.response);return}
if(a==="acceptTalk"){acceptTalk(b.dataset.id);return}
if(a==="declineTalk"){declineTalk(b.dataset.id);return}

if(a==="save"){saveState();return}
if(a==="restore"){
if(loadState()&&state.started){
render();
showToast("保存データを復元しました。");
}else showToast("復元できる保存データがありません。");
return;
}
if(a==="newGame"){
if(confirm("現在のゲームを終了して、新しいゲームを始めますか？")){
localStorage.removeItem(STORAGE_KEY);
state=defaultState();
render();
}
return;
}
if(a==="diagnose"){
const buttons=[...document.querySelectorAll("button[data-action]")];
const actions=buttons.map(x=>x.dataset.action).filter(Boolean);
showToast("診断OK：現在の画面に"+buttons.length+"個の操作ボタンがあります。");
log("UI診断を実行。操作ボタン"+buttons.length+"個を確認。");
return;
}

if(a==="closeModal"){closeModal();return}

}catch(err){
console.error(err);
showToast("操作中にエラーが発生しました。画面を再表示します。");
try{render()}catch(_){}
}
}

/* =========================================================
初期化
========================================================= */

document.addEventListener("click",handleClick);

window.addEventListener("error",function(e){
console.error(e.error||e.message);
});

(function init(){
try{
const restored=loadState();
if(restored && state.started){
render();
showToast("前回のゲームを自動復元しました。");
}else{
state=defaultState();
render();
}
}catch(e){
console.error(e);
state=defaultState();
render();
}
})();
</script>
