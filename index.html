.news-title{

.news-meta{

.event-banner{

}

.home-content{

}

.district.selected{

}

.district .dname{
font-size:11px;

.district .dbar{

}

.district .dbar div{

}

.district .dinfo{

.table-wrap{

table{

/* =========================================================
基本ユーティリティ
========================================================= */

function rand(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}

function clamp(v,min,max){
return Math.max(min,Math.min(max,v));
}

function avg(arr){
if(!arr.length) return 0;
return arr.reduce((a,b)=>a+b,0)/arr.length;
}

function fmt(v){
return Number(v).toLocaleString("ja-JP");
}

function signed(v){
return (v>=0?"+":"")+Number(v).toFixed(1);
}

function partyById(id){
return state.parties.find(p=>p.id===id);
}

function politicianById(id){
return state.politicians.find(p=>p.id===id);
}

function memberById(id){
return state.partyMembers.find(p=>p.id===id);
}

function playerParty(){
return partyById(state.player.partyId);
}

function playerPolitician(){
return politicianById(state.player.politicianId);
}

function isPlayerLeader(){
const p=playerParty();
return !!p && p.leaderId===state.player.politicianId;
}

function isPlayerPM(){
return state.government.pmId===state.player.politicianId;
}

function playerIsMP(){
return !!state.player.politicianId &&
state.politicians.some(p=>p.id===state.player.politicianId && p.active);
}

function partyName(id){
return partyById(id)?.name || "無所属";
}

function monthLabel(){
return state.date.year+"年"+MONTH_NAMES[state.date.month-1];
}

function showToast(text){
const el=document.getElementById("toast");
if(!el)return;
el.textContent=text;
el.classList.add("show");
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>el.classList.remove("show"),2800);
}

function saveGame(){
try{
localStorage.setItem(SAVE_KEY,JSON.stringify(state));
}catch(e){
console.error(e);
}
}

function restoreGame(){
try{
const raw=localStorage.getItem(SAVE_KEY);
if(!raw)return false;
const parsed=JSON.parse(raw);
if(!parsed || !parsed.version)return false;
state=parsed;
currentTab=state.tab||"home";
return true;
}catch(e){
console.error(e);
return false;
}
}

function deleteSave(){

function calculateInitialSupport(parties){
/*
国民意識はランダムに生成するが、
「国民意識」と政党理念の距離を必ず考慮する。
そのため、中道なのに極端な政党が異常に高い、
という矛盾を避ける。
*/
const climate=rand(42,62);
const economyMood=rand(40,65);
const securityMood=rand(45,72);
const welfareMood=rand(42,68);
const immigrationMood=rand(40,65);

parties.forEach(p=>{
const distance=Math.abs(p.ideology-climate);
const economyFit=100-Math.abs(p.stance.economy-economyMood);
const securityFit=100-Math.abs(p.stance.defense-securityMood);
const welfareFit=100-Math.abs(p.stance.welfare-welfareMood);
const immigrationFit=100-Math.abs(p.stance.immigration-immigrationMood);

let score=
38-distance*.62+
economyFit*.09+
securityFit*.09+
welfareFit*.08+
immigrationFit*.08+
rand(-4,4);

score*=p.base/10;
p.support=0;
});

const weights=parties.map(p=>{
const distance=Math.abs(p.ideology-climate);
let w=Math.max(0.5,
15-distance*.17+
p.base*.5+
rand(-2,2)
);
return w;
});

const total=weights.reduce((a,b)=>a+b,0);

parties.forEach((p,i)=>{
p.support=clamp(weights[i]/total*100,0.3,55);
p.publishedSupport=p.support;
});

return {
ideology:climate,
economy:economyMood,
security:securityMood,
welfare:welfareMood,
immigration:immigrationMood
};
}

function render(){

const left=`rgba(48,110,255,${Math.max(.08,(50-climate)/250+.08)})`;
const right=`rgba(255,70,80,${Math.max(.08,(climate-50)/250+.08)})`;

app.innerHTML=`
<div class="app">

${renderNav()}
<main id="main">

</main>
<div id="toast" class="toast"></div>

function escapeAttr(s){
return String(s).replace(/"/g,"&quot;");
}

function getOpponentForDistrict(d,partyId){
const others=state.politicians.filter(p=>p.active&&p.partyId!==partyId);
if(!others.length)return "対抗馬なし";
const idx=Math.abs(hashCode(d))%others.length;
return others[idx].name+"（"+partyById(others[idx].partyId)?.short+"）";
}

function hashCode(str){
let h=0;
for(let i=0;i<str.length;i++)h=((h<<5)-h)+str.charCodeAt(i)|0;
return Math.abs(h);
}

function econCard(name,value,unit,accent){
return `
<div class="card kpi ${accent}">
<div class="kpi-label">${name}</div>
<div class="kpi-value">${value}</div>
<div class="kpi-sub">${unit}</div>
</div>
`;
}

function generateEconomy(){
state.economy={
nikkei:42000,
cpi:2.4,
gasoline:176,
rice:4200,
seafood:105,
policyRate:.5,
unemployment:2.5,
wageGrowth:2.8,
fx:148,
crimeIndex:38,
violentCrime:1800,
foreignInvolvedCases:90
};
return state.economy;
}

function economyNarrative(e){
if(e.cpi>4 && e.unemployment>3.5)return "物価高と雇用悪化が同時進行";
if(e.cpi>3.5)return "インフレ圧力が強い";
if(e.wageGrowth>4 && e.unemployment<2.5)return "賃金主導の強い景気";
if(e.unemployment<2.7)return "雇用は比較的堅調";
return "緩やかな景気推移";
}

function spendAction(type){
if(state.actionsLeft<=0){
showToast("今月の行動回数は4回までです。翌月まで待ってください。");
return;
}

state.actionsLeft--;

const player=playerPolitician();
const party=playerParty();

if(type==="media"){
const gain=rand(2,6)+(player?.communication||40)/50;
state.player.recognition=clamp(state.player.recognition+gain,0,100);
state.player.nationalSupport=clamp(
state.player.nationalSupport+gain*.24+(party.support<5?.15:0),
0,100
);
party.support=clamp(party.support+gain*.10,0.1,60);

const membersGain=Math.max(20,Math.round(party.members*(gain/100)*.18));
party.members+=membersGain;

addLog("メディア出演。認知度が "+gain.toFixed(1)+" 上昇した。","success");
addNews("個人",state.player.name+"がメディア出演","発言が注目され、個人認知度と支持率が上昇した。");
}

if(type==="speech"){
const gain=rand(1,4)+(player?.communication||40)/80;
state.player.nationalSupport=clamp(state.player.nationalSupport+gain*.35,0,100);
state.player.recognition=clamp(state.player.recognition+gain*.45,0,100);
state.player.internalSupport=clamp(state.player.internalSupport+gain*.25,0,100);
party.support=clamp(party.support+gain*.08,0.1,60);

addLog("街頭演説を実施。地元と全国で支持を伸ばした。","success");
}

if(type==="local"){
const gain=rand(2,5)+(player?.organization||40)/70;
state.player.internalSupport=clamp(state.player.internalSupport+gain*.6,0,100);
party.members+=rand(40,130);
party.support=clamp(party.support+gain*.04,0.1,60);

addLog("地元活動を実施。党内支持と党員基盤が強化された。","success");
}

if(type==="network"){
if(!player){
showToast("政治家として活動していません。");
}else{
player.network=clamp(player.network+rand(1,3),0,100);
const candidates=state.politicians
.filter(p=>p.id!=="player")
.sort((a,b)=>a.network-b.network);

const target=candidates[rand(0,Math.max(0,candidates.length-1))];

if(target){
const r=state.relations[target.id];
r.familiarity=clamp(r.familiarity+rand(3,7),0,100);
r.trust=clamp(r.trust+rand(1,3),0,100);
addLog(target.name+"との人脈を一歩深めた。","success");
}
}
}

publishQuarterly();
updateNews();
saveGame();
render();
showToast("行動を実行しました。残り "+state.actionsLeft+"回。");
}

function runAutoActions(){
if(!state.autoMode)return;

const political=document.getElementById("autoPolitical")?.value||state.autoPolicy?.political||"balanced";
const network=document.getElementById("autoNetwork")?.value||state.autoPolicy?.network||"middle";
const election=document.getElementById("autoElection")?.value||state.autoPolicy?.election||"support";

for(let i=0;i<4;i++){
let type;

if(political==="media")type=i<2?"media":i===2?"speech":"network";
else if(political==="local")type=i<2?"local":i===2?"network":"speech";
else if(political==="speech")type=i<2?"speech":i===2?"media":"local";
else type=["media","speech","local","network"][i];

if(network==="senior" && type==="network"){
const target=state.politicians
.filter(p=>p.id!=="player")
.sort((a,b)=>(state.relations[b.id]?.network||0)-(state.relations[a.id]?.network||0))[0];

if(target){
const r=state.relations[target.id];
r.familiarity=clamp(r.familiarity+4,0,100);
r.trust=clamp(r.trust+2,0,100);
}
}

spendActionSilent(type);
}

addLog("自動行動モードにより4回分の活動を実施。","success");
}

state.actionsLeft--;

const player=playerPolitician();
const party=playerParty();

const gain=rand(2,5)+(player?.communication||40)/60;
state.player.recognition=clamp(state.player.recognition+gain,0,100);
state.player.nationalSupport=clamp(state.player.nationalSupport+gain*.18,0,100);
party.support=clamp(party.support+gain*.07,.1,60);
party.members+=Math.max(10,Math.round(party.members*gain*.001));
}

if(type==="speech"){
state.player.nationalSupport=clamp(state.player.nationalSupport+rand(1,3),0,100);
state.player.recognition=clamp(state.player.recognition+rand(1,2),0,100);
}

if(type==="local"){
state.player.internalSupport=clamp(state.player.internalSupport+rand(1,3),0,100);
party.members+=rand(20,70);
}

if(type==="network" && player){
player.network=clamp(player.network+rand(1,2),0,100);
const target=state.politicians.filter(p=>p.id!=="player")[rand(0,state.politicians.filter(p=>p.id!=="player").length-1)];
if(target){
const r=state.relations[target.id];
r.familiarity=clamp(r.familiarity+2,0,100);
}
}
}

/* =========================================================
支持率
========================================================= */

function updateSupport(){
const mood=state.publicMood;
const p=state.player.policy;

state.parties.forEach(party=>{
const distance=Math.abs(party.ideology-mood.ideology);
const economicFit=100-Math.abs(party.stance.economy-mood.economy);
const securityFit=100-Math.abs(party.stance.defense-mood.security);
const welfareFit=100-Math.abs(party.stance.welfare-mood.welfare);

let desired=
20+
(100-distance)*.26+
economicFit*.08+
securityFit*.07+
welfareFit*.07+
Math.log10(Math.max(10,party.members))*2;

desired+=rand(-1.4,1.4);

if(party.id===state.player.partyId){
desired+=state.player.recognition*.05;
desired+=state.player.nationalSupport*.06;
}

party.support=clamp(
party.support*.72+desired*.28,
.1,
60
);
});

/*
支持率を100%に正規化。
*/
const total=state.parties.reduce((s,p)=>s+p.support,0);
state.parties.forEach(p=>{
p.support=p.support/total*100;
});

const player=state.player;
player.nationalSupport=clamp(
player.nationalSupport+
(player.recognition*.018)-
.04+
rand(-.3,.3),
0,100
);
}

if([3,6,9,12].includes(state.date.month)){
state.parties.forEach(p=>p.publishedSupport=p.support);

}
}

const d=document.getElementById("eventDefense")?.value;

}

if(e.type==="crime-police"){

state.player.nationalSupport+=1;

if(e.type==="crime-prevention"){

state.player.nationalSupport=clamp(state.player.nationalSupport,0,100);

state.currentEvent=null;
closeModal();
saveGame();

(p?.organization||50)*.28+
(p?.respect||50)*.18+
(p?.network||50)*.16+
(p?.ambition||50)*.10+
rand(-8,8);
});

function relationMeeting(id){
const p=politicianById(id);
if(!p)return;

const r=state.relations[id];

if(r.cooldown>0){
showToast("まだ面談の間隔が空いていません。");
return;
}

if(r.familiarity<20 && p.human>80){
showToast("相手は重鎮です。まず紹介や中堅議員との関係構築が必要です。");
return;
}

const ability=playerPolitician()?.network||20;
const chance=clamp(35+ability*.35+r.familiarity*.25,0,95);

if(Math.random()*100<chance){
r.familiarity=clamp(r.familiarity+rand(4,9),0,100);
r.trust=clamp(r.trust+rand(2,6),0,100);
r.respect=clamp(r.respect+rand(1,4),0,100);
r.lastMeeting=monthLabel();
r.cooldown=2;

addLog(p.name+"との面談に成功。人脈が強化された。","success");
showToast(p.name+"との面談が実現しました。");
}else{
r.familiarity=clamp(r.familiarity+1,0,100);
r.cooldown=1;
addLog(p.name+"への面談申し込みは今回は見送られた。","normal");
showToast("今回は会談につながりませんでした。");
}

saveGame();
closeModal();
render();
}

function relationDinner(id){
const p=politicianById(id);
if(!p)return;

const r=state.relations[id];

if(r.familiarity<35){
showToast("会食にはもう少し面識が必要です。まず面談・紹介を重ねてください。");
return;
}

r.familiarity=clamp(r.familiarity+rand(6,12),0,100);
r.trust=clamp(r.trust+rand(4,9),0,100);
r.favor=clamp(r.favor+rand(2,7),0,100);
r.cooldown=3;

if(playerPolitician()){
playerPolitician().network=clamp(playerPolitician().network+rand(1,3),0,100);
}

addLog(p.name+"と会食。信頼関係が大きく進展した。","success");
saveGame();
closeModal();
render();
showToast(p.name+"との会食を行いました。");
}

function relationIntroduce(id){
const p=politicianById(id);
if(!p)return;

const r=state.relations[id];

if(r.familiarity<45){
showToast("紹介を頼むには、もう少し親しくなる必要があります。");
return;
}

const targets=state.politicians.filter(x=>
x.id!==p.id &&
x.partyId===p.partyId &&
x.human>=75 &&
(state.relations[x.id]?.familiarity||0)<40
);

if(!targets.length){
showToast("現在、紹介可能な重鎮候補が見つかりません。");
return;
}

const target=targets[rand(0,targets.length-1)];
const tr=state.relations[target.id];

tr.familiarity=clamp(tr.familiarity+rand(10,18),0,100);
tr.trust=clamp(tr.trust+rand(3,7),0,100);

addLog(p.name+"の紹介で"+target.name+"との接点を得た。","success");

saveGame();
closeModal();
render();
showToast(p.name+"の紹介で"+target.name+"への人脈が開きました。");
}

function createBill(){
const bills=[
["成長投資促進法案","研究開発・設備投資への支援を拡大する。"],
["社会保障改革法案","医療・年金制度の持続可能性を高める。"],
["サイバー安全保障法案","重要インフラの防御体制を強化する。"],
["子育て支援法案","子育て世帯への給付・支援を拡充する。"],
["防衛基盤強化法案","防衛産業と防衛装備の基盤を強化する。"]
];

const b=bills[rand(0,bills.length-1)];

let yes=0;
let no=0;

state.parties.forEach(p=>{
const stance=
p.ideology>65?1:
p.ideology<35?-1:
Math.random()>.45?1:-1;

if(stance>0)yes+=p.seatsL;
else no+=p.seatsL;
});

state.activeBill={
id:"bill_"+Date.now(),
title:b[0],
summary:b[1],
yesEstimate:yes,
noEstimate:no,
voted:false
};

addLog("国会に「"+b[0]+"」が提出された。","normal");
saveGame();
render();
showToast("法案が審議入りしました。");
}

function voteBill(vote){
if(!state.activeBill)return;

if(state.activeBill.voted){
showToast("すでに投票済みです。");
return;
}

const party=playerParty();

if(vote==="yes")state.activeBill.yesEstimate+=1;
if(vote==="no")state.activeBill.noEstimate+=1;

state.activeBill.voted=true;

const passed=state.activeBill.yesEstimate>=233;

addLog(
"「"+state.activeBill.title+"」に"+(vote==="yes"?"賛成":vote==="no"?"反対":"棄権")+"票を投じた。"+
(passed?" 法案は可決された。":" 法案は否決された。"),
passed?"success":"danger"
);

if(passed){
state.government.approval=clamp(state.government.approval+1,0,100);
}else{
state.government.approval=clamp(state.government.approval-1,0,100);
}

state.activeBill=null;
saveGame();
render();
showToast(passed?"法案は可決されました。":"法案は否決されました。");
}

function conductLowerElection(){
const party=playerParty();

let wins=0;

Object.entries(party.candidateMap).forEach(([district,id])=>{
const candidate=politicianById(id);
if(!candidate)return;

const base=party.support+
candidate.popularity*.12+
candidate.organization*.10+
candidate.execution*.05+
rand(-8,8);

if(base>50)wins++;
});

const prWins=Math.round(
clamp(party.support/100*176*.85+
party.prList.length*.25+
rand(-2,3),0,176)
);

party.seatsL=clamp(wins+prWins,0,289+176);

if(party.id===state.government.partyId && party.seatsL<233){
state.government.approval=clamp(state.government.approval-8,0,100);
}

if(party.seatsL>=233){
state.government.partyId=party.id;
party.leaderId=party.leaderId||"player";
if(party.leaderId==="player"){
state.government.pmId="player";
}else{
state.government.pmId=party.leaderId;
}
}

state.flags.firstElectionDone=true;
state.nextLowerElection.year+=4;

addNews(
"政局",
"衆議院総選挙が実施された",
party.name+"は"+party.seatsL+"議席を獲得した。"
);

addLog(
"衆院選結果："+party.name+" "+party.seatsL+"議席。",
"success"
);

saveGame();
closeModal();
render();
showToast("衆院選が終了しました。");
}

state.player.name+"の活動が注目される",
"最近の政治活動や発言についてメディアが取り上げた。"
);
}
}

/* =========================================================
新党参加・所属変更
========================================================= */

function politicianJoinParty(id){
const p=politicianById(id);
if(!p)return;

p.partyId=state.player.partyId;

addLog(p.name+"があなたの党に参加した。","success");
playerParty().members+=rand(100,500);

saveGame();
closeModal();
render();
showToast(p.name+"が所属政党を変更しました。");
}

/* =========================================================
セーブ復元時の不足データ補完
========================================================= */

function repairState(){
if(!state)return;

if(!state.news)state.news={personal:[],politics:[],economy:[]};
if(!state.logs)state.logs=[];
if(!state.relations)state.relations={};
if(!state.foreignRelations)state.foreignRelations={};
if(!state.partyMembers)state.partyMembers=[];
if(!state.actionsLeft && state.actionsLeft!==0)state.actionsLeft=4;
if(!state.parties)state.parties=createParties();

if(!state.economy){
generateEconomy();
}

state.politicians.forEach(p=>{
if(!state.relations[p.id]){
state.relations[p.id]={
familiarity:rand(5,25),
trust:rand(10,35),
respect:rand(15,45),
favor:rand(0,20),
lastMeeting:null,
cooldown:0
};
}
});

FOREIGN_LEADERS.forEach(f=>{
if(!state.foreignRelations[f[0]]){
state.foreignRelations[f[0]]={
relation:f[4],
trust:rand(35,70),
meetings:0,
cooldown:0
};
}
});

state.parties.forEach(p=>{
if(!p.candidateMap)p.candidateMap={};
if(!p.prList)p.prList=[];
if(!p.executives)p.executives=[];
if(p.support===undefined)p.support=1;
if(p.publishedSupport===undefined)p.publishedSupport=p.support;
if(p.members===undefined)p.members=5;
});
}

function createStartPartyList(){
/*
スタート画面で政党が表示されない問題を防ぐため、
state未作成でも独立して政党リストを生成。
*/
const temp=REAL_PARTIES.map(p=>({
...p,
support:rand(2,20)
}));

const total=temp.reduce((s,p)=>s+p.support,0);

temp.forEach(p=>{
p.support=p.support/total*100;
});

return temp;
}

/* =========================================================
イベント委譲の追加処理
========================================================= */

document.addEventListener("click",function(e){

const b=e.target.closest("[data-action]");
if(!b)return;

if(b.dataset.action==="start-existing"){
startExistingParty();
return;
}

if(b.dataset.action==="create-party"){
createNewParty();
return;
}

if(b.dataset.action==="leadership-run-confirm"){
const le=state.leadershipElection;
if(!le)return;

const candidate=le.candidates.find(c=>c.id==="player");

if(!candidate){
le.candidates.push({
id:"player",
platform:{
nuclear:rand(35,80),
defense:rand(40,85),
immigration:rand(30,75),
health:rand(40,80),
diplomacy:rand(50,90)
},
entered:true
});
}

const map={
pro:80,middle:55,anti:25,
strong:85,
balanced:60,
restrained:35,
open:80,
managed:55,
restrict:30,
spend:80,
reform:55,
lean:30,
proactive:85,
restrainedDiplomacy:30
};

const n=document.getElementById("leaderNuclear")?.value;
const d=document.getElementById("leaderDefense")?.value;
const im=document.getElementById("leaderImmigration")?.value;
const h=document.getElementById("leaderHealth")?.value;
const dip=document.getElementById("leaderDiplomacy")?.value;

candidate.platform.nuclear=map[n]??55;
candidate.platform.defense=map[d]??60;
candidate.platform.immigration=map[im]??55;
candidate.platform.health=map[h]??55;
candidate.platform.diplomacy=
dip==="proactive"?85:
dip==="balanced"?60:35;

le.playerEntered=true;
le.stage="vote";

saveGame();
renderLeadershipModal();
return;
}

if(b.dataset.action==="foreign-response"){
foreignResponse(b.dataset.answer);
return;
}
});

/* =========================================================
DOM初期化
========================================================= */

(function init(){

if(restoreGame()){
repairState();

if(!state.started){
state=null;
render();
return;
}

saveGame();
render();
showToast("前回のゲームを自動復元しました。");
}else{
state=null;
render();
}

})();
</script>
